<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>Painel Administrativo | Rifa Premiada · WS Soluções</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1120;
      --bg-glow: radial-gradient(circle at 50% 0%, #1c2c4c 0%, #0b1120 65%);
      --panel: #131c31;
      --panel2: #1b2742;
      --panel-hover: #233354;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --accent-glow: rgba(245, 158, 11, 0.32);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --red: #ef4444;
      --yellow: #eab308;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(245, 158, 11, 0.4);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      background-image: var(--bg-glow);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* CABEÇALHO */
    header {
      min-height: 68px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #1c1204;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-title span {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* LAYOUT PRINCIPAL */
    .container {
      max-width: 1080px;
      margin: auto;
      padding: 20px 16px 90px;
    }

    .card {
      background: linear-gradient(180deg, rgba(25, 36, 61, 0.92) 0%, rgba(19, 28, 49, 0.96) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.45);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--accent-light);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 10px;
      color: #fff;
    }

    .section-title i, .section-title svg {
      color: var(--accent-light);
    }

    h3 {
      margin: 18px 0 10px;
      font-size: 16.5px;
      font-weight: 700;
      color: #fff;
    }

    p {
      color: var(--muted);
      line-height: 1.65;
      margin: 8px 0;
    }

    .small {
      font-size: 12.5px;
      color: var(--muted);
    }

    /* FORMULÁRIOS E BOTÕES */
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .field {
      flex: 1;
      min-width: 190px;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .input-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input {
      background: #0b1221;
      border: 1px solid var(--border);
      color: white;
      border-radius: 12px;
      padding: 13px 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #1c1204;
      font-weight: 800;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn.secondary {
      background: var(--panel2);
      color: #f1f5f9;
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn.secondary:hover:not(:disabled) {
      background: var(--panel-hover);
    }

    .btn.danger {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      box-shadow: none;
    }

    .btn.danger:hover:not(:disabled) {
      background: var(--red);
      color: #fff;
    }

    .btn.green {
      background: linear-gradient(135deg, #34d399, var(--green));
      color: #032619;
      box-shadow: 0 6px 20px var(--green-glow);
    }

    .hidden {
      display: none !important;
    }

    /* GRADE DE NÚMEROS */
    .numbers {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .number {
      aspect-ratio: 1;
      background: linear-gradient(180deg, #1f2e4d 0%, #17233c 100%);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #f1f5f9;
      border-radius: 11px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .number:hover:not(.sold):not(.selected) {
      border-color: var(--accent);
      background: #26395e;
      transform: translateY(-2px);
    }

    .number.selected {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #1c1204;
      border-color: #fde68a;
      font-weight: 800;
      box-shadow: 0 6px 16px var(--accent-glow);
      transform: scale(1.03);
    }

    .number.sold {
      background: rgba(127, 29, 29, 0.32);
      color: rgba(252, 165, 165, 0.45);
      border-color: rgba(239, 68, 68, 0.2);
      cursor: not-allowed;
      text-decoration: line-through;
      box-shadow: none;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .price {
      font-size: 24px;
      color: var(--accent-light);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* PEDIDOS */
    .order {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .order:last-child {
      border: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-left: 6px;
    }

    .pending {
      background: rgba(234, 179, 8, 0.16);
      border: 1px solid rgba(234, 179, 8, 0.35);
      color: #fde047;
    }

    .approved {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .rejected {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* ADMIN */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .tab {
      background: var(--panel2);
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #1c1204;
      border-color: transparent;
      font-weight: 800;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .stat {
      background: rgba(11, 18, 33, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: var(--accent-light);
      margin-top: 6px;
      font-weight: 800;
    }

    .tool-box {
      background: rgba(11, 18, 33, 0.65);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
    }

    .confirm-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .token-reveal-box {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      color: #0f172a;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 14px;
    }

    .token-reveal-box strong {
      display: block;
      font-size: 34px;
      letter-spacing: 7px;
      margin: 10px 0;
      color: #0f172a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    td, th {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .table-wrap {
      overflow-x: auto;
    }

    /* MODAIS */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 9, 18, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }

    .modal-box h2 {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      padding: 28px 16px;
      line-height: 1.6;
    }

    footer strong {
      color: #e2e8f0;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 100;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    @media (max-width: 700px) {
      .numbers {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .number {
        font-size: 15px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .container {
        padding: 14px 12px 90px;
      }

      header {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge"><i data-lucide="shield-check" size="20"></i></div>
      <div>
        <div class="brand-title">RIFA <span>ADMIN</span></div>
        <div class="brand-sub">WS Soluções</div>
      </div>
    </div>
    <button class="btn secondary" style="padding:9px 14px;font-size:13px" onclick="openAdminLogin()">
      <i data-lucide="key-round" size="15"></i> Login ADM
    </button>
  </header>

  <main class="container">
    <!-- PAINEL ADMINISTRATIVO -->
    <section class="card hidden" id="adminPanel">
      <div class="row" style="justify-content:space-between">
        <div>
          <span class="tag"><i data-lucide="lock" size="13"></i> ÁREA RESTRITA · WS SOLUÇÕES</span>
          <h2 class="section-title" style="margin-top:10px">Painel administrativo</h2>
        </div>
        <button class="btn secondary" onclick="adminLogout()">
          <i data-lucide="log-out" size="17"></i> Sair
        </button>
      </div>

      <div class="stat-grid" id="adminStats"></div>

      <div class="tabs">
        <button class="tab active" onclick="adminTab('pending',this)">Pendentes</button>
        <button class="tab" onclick="adminTab('all',this)">Todos pedidos</button>
        <button class="tab" onclick="adminTab('manual',this)">Venda manual</button>
        <button class="tab" onclick="adminTab('numbers',this)">Números</button>
        <button class="tab" onclick="adminTab('lookup',this)">Consultar número</button>
        <button class="tab" onclick="adminTab('clients',this)">Clientes</button>
        <button class="tab" onclick="adminTab('recover_token',this)">Recuperar token</button>
        <button class="tab" onclick="adminTab('payments',this)">Pagamentos</button>
      </div>

      <div id="adminContent"></div>

      <button class="btn secondary" style="margin-top:18px" onclick="loadAdmin()">
        <i data-lucide="refresh-cw" size="16"></i> Atualizar painel
      </button>
    </section>
  </main>

  <footer>
    <strong>WS SOLUÇÕES</strong><br>
    Área Administrativa · Rifa Premiada · Ventilador Mondial VSP-30-B
  </footer>

  <div id="toast"></div>

  <!-- LOGIN ADMIN -->
  <div class="modal hidden" id="adminLoginModal">
    <div class="modal-box">
      <h2><i data-lucide="shield" size="21" style="color:var(--accent-light)"></i> Acesso administrativo</h2>
      <p>Entre com o usuário autorizado no Supabase.</p>
      <div class="form-stack">
        <div>
          <label class="input-label" for="adminEmail">E-mail administrativo</label>
          <input id="adminEmail" type="email" placeholder="E-mail administrativo">
        </div>
        <div>
          <label class="input-label" for="adminPassword">Senha</label>
          <input id="adminPassword" type="password" placeholder="Senha">
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn" style="flex:1" onclick="adminLogin()">Entrar</button>
          <button class="btn secondary" style="flex:1" onclick="closeAdminLogin()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL='https://supohabonmgsrjljlugj.supabase.co';
    const SUPABASE_KEY='sb_publishable_vPpRawuRveyEYI0rdQuV7g_7nASyNXA';
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    let manualSelected=[];
    let numbersData=[];
    let adminUser=null;
    let currentAdminTab='pending';
    let cachedOrders=[];
    let cachedParticipants=[];
    let cachedPayments=[];
    let pendingTokenResetTarget=null;
    let oneTimeResetToken=null;

    /* UTILITÁRIOS */
    function toast(message){
      const el=document.getElementById('toast');
      el.textContent=message;
      el.style.display='block';
      clearTimeout(window.toastTimer);
      window.toastTimer=setTimeout(()=>el.style.display='none',4000);
    }

    function money(value){
      return Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    }

    function priceFor(qty){
      const prices=[0,6,10,15,18];
      let total=0;
      while(qty>0){
        const group=Math.min(qty,4);
        total+=prices[group];
        qty-=group;
      }
      return total;
    }

    function escapeHTML(value){
      return String(value??'').replace(/[&<>"']/g,char=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[char]));
    }

    function normalizePhoneDigits(phone){
      return String(phone??'').replace(/\D/g,'');
    }

    function statusBadge(status){
      const s=String(status||'').toLowerCase();
      if(s==='approved'||s==='confirmed'||s==='paid'||s==='sold'){
        return `<span class="status approved">${escapeHTML(status)}</span>`;
      }
      if(s==='rejected'||s==='cancelled'||s==='canceled'||s==='failed'){
        return `<span class="status rejected">${escapeHTML(status)}</span>`;
      }
      return `<span class="status pending">${escapeHTML(status||'pendente')}</span>`;
    }

    function openAdminLogin(){
      document.getElementById('adminLoginModal').classList.remove('hidden');
    }

    function closeAdminLogin(){
      document.getElementById('adminLoginModal').classList.add('hidden');
    }

    /* LOGIN ADMINISTRATIVO */
    async function adminLogin(){
      const email=document.getElementById('adminEmail').value.trim();
      const password=document.getElementById('adminPassword').value;
      if(!email||!password)return toast('Informe e-mail e senha.');

      const {data,error}=await db.auth.signInWithPassword({email,password});
      if(error){
        console.error('Erro de login:',error);
        return toast('Falha no login: '+error.message);
      }

      const user=data.user;
      if(!user){
        await db.auth.signOut();
        return toast('O Supabase não retornou um usuário autenticado.');
      }

      const {data:admin,error:adminError}=await db
        .from('admin_users')
        .select('id')
        .eq('id',user.id)
        .maybeSingle();

      console.log('USUÁRIO AUTENTICADO:',user.id);
      console.log('ADMIN ENCONTRADO:',admin);
      console.log('ERRO DA CONSULTA ADMIN:',adminError);

      if(adminError){
        await db.auth.signOut();
        return toast('Erro ao verificar administrador: '+adminError.message);
      }

      if(!admin){
        await db.auth.signOut();
        return toast('Usuário não autorizado. ID: '+user.id);
      }

      adminUser=user;
      closeAdminLogin();
      document.getElementById('adminPanel').classList.remove('hidden');
      await loadAdmin();
      document.getElementById('adminPanel').scrollIntoView({behavior:'smooth'});
      toast('Acesso administrativo liberado.');
    }

    async function adminLogout(){
      clearOneTimeResetToken();
      pendingTokenResetTarget=null;
      await db.auth.signOut();
      adminUser=null;
      document.getElementById('adminPanel').classList.add('hidden');
      openAdminLogin();
      toast('Sessão administrativa encerrada.');
    }

    /* CARREGAMENTO DO PAINEL */
    async function loadAdmin(){
      if(!adminUser)return;

      const [numbers,orders,participants,payments]=await Promise.all([
        db.from('numbers').select('id,status').order('id'),
        db.from('orders').select('*').order('created_at',{ascending:false}),
        db.from('participants').select('id,full_name,whatsapp,created_at'),
        db.from('payments').select('*').order('created_at',{ascending:false})
      ]);

      const errors=[numbers,orders,participants,payments].filter(x=>x.error);
      if(errors.length){
        console.error('Erros painel:',errors);
        return toast('Erro ao carregar painel: '+
          errors.map(x=>x.error.message).join(' | '));
      }

      numbersData=numbers.data||[];
      cachedOrders=orders.data||[];
      cachedParticipants=participants.data||[];
      cachedPayments=payments.data||[];

      const sold=numbersData.filter(n=>n.status==='sold').length;
      const pending=cachedOrders.filter(o=>o.status==='pending').length;
      const confirmed=cachedPayments
        .filter(p=>p.status==='confirmed')
        .reduce((s,p)=>s+Number(p.amount),0);

      document.getElementById('adminStats').innerHTML=`
        <div class="stat"><span class="small">Números vendidos</span><strong>${sold}/100</strong></div>
        <div class="stat"><span class="small">Pedidos pendentes</span><strong>${pending}</strong></div>
        <div class="stat"><span class="small">Cadastros com token</span><strong>${cachedParticipants.length}</strong></div>
        <div class="stat"><span class="small">Confirmado</span><strong>${money(confirmed)}</strong></div>
      `;

      renderAdminTab();
    }

    /* ABAS ADMINISTRATIVAS */
    function adminTab(tab,button){
      if(currentAdminTab==='recover_token'&&tab!=='recover_token'){
        clearOneTimeResetToken();
        pendingTokenResetTarget=null;
      }
      currentAdminTab=tab;
      document.querySelectorAll('#adminPanel .tab')
        .forEach(b=>b.classList.remove('active'));
      if(button)button.classList.add('active');
      renderAdminTab();
    }

    function renderAdminTab(){
      const box=document.getElementById('adminContent');

      if(currentAdminTab==='manual'){
        renderManualSale(box);
        return;
      }

      if(currentAdminTab==='numbers'){
        box.innerHTML='<h3>Números da rifa</h3><div class="numbers" id="adminNumbers"></div>';
        const grid=document.getElementById('adminNumbers');
        numbersData.forEach(n=>{
          const el=document.createElement('div');
          el.className='number '+(n.status==='sold'?'sold':'');
          el.style.display='grid';
          el.style.placeItems='center';
          el.textContent=String(n.id).padStart(2,'0');
          grid.appendChild(el);
        });
        return;
      }

      if(currentAdminTab==='lookup'){
        renderNumberLookup(box);
        return;
      }

      if(currentAdminTab==='recover_token'){
        renderRecoverToken(box);
        return;
      }

      if(currentAdminTab==='clients'){
        box.innerHTML=`
          <h3>Clientes cadastrados com token</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nome</th><th>WhatsApp</th><th>Cadastro</th></tr></thead>
              <tbody>
                ${cachedParticipants.map(p=>`
                  <tr>
                    <td>${escapeHTML(p.full_name)}</td>
                    <td>${escapeHTML(p.whatsapp)}</td>
                    <td>${new Date(p.created_at).toLocaleDateString('pt-BR')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <p class="small">Vendas sem cadastro aparecem em Todos pedidos.</p>
        `;
        return;
      }

      if(currentAdminTab==='payments'){
        box.innerHTML=`
          <h3>Pagamentos</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pedido</th><th>Valor</th><th>Status</th></tr></thead>
              <tbody>
                ${cachedPayments.map(p=>`
                  <tr>
                    <td>${escapeHTML(p.order_id)}</td>
                    <td>${money(p.amount)}</td>
                    <td>${escapeHTML(p.status)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
        return;
      }

      let orders=cachedOrders;
      if(currentAdminTab==='pending')
        orders=orders.filter(o=>o.status==='pending');

      if(!orders.length){
        box.innerHTML='<p>Nenhum pedido nesta categoria.</p>';
        return;
      }

      box.innerHTML='<h3>'+
        (currentAdminTab==='pending'?'Pedidos aguardando aprovação':'Todos os pedidos')+
        '</h3><div id="adminOrders"></div>';

      const list=document.getElementById('adminOrders');
      orders.forEach(order=>{
        const participant=cachedParticipants.find(p=>p.id===order.participant_id);
        const name=order.customer_name||participant?.full_name||'Cliente sem cadastro';
        const whatsapp=order.customer_whatsapp||participant?.whatsapp||'—';

        const div=document.createElement('div');
        div.className='order';
        const cls=order.status==='approved'?'approved':
          order.status==='rejected'?'rejected':'pending';

        div.innerHTML=`
          <strong>${escapeHTML(name)}</strong>
          <span class="status ${cls}">${escapeHTML(order.status)}</span>
          <p>${money(order.total_amount)} · ${new Date(order.created_at).toLocaleString('pt-BR')}</p>
          <p class="small">Pedido: ${escapeHTML(order.id)}</p>
          <p class="small">WhatsApp: ${escapeHTML(whatsapp)}</p>
          <p class="small">${order.customer_name?'Venda manual, sem token':'Pedido de cliente cadastrado'}</p>
          <div class="row" id="orderNumbers-${order.id}"></div>
          ${order.status==='pending'?`
            <div class="row" style="margin-top:12px">
              <button class="btn green" onclick="approveOrder('${order.id}')">Confirmar pagamento e aprovar</button>
              <button class="btn danger" onclick="rejectOrder('${order.id}')">Rejeitar</button>
            </div>
          `:''}
        `;
        list.appendChild(div);
        loadOrderNumbers(order.id);
      });
    }

    /* 1. RECUPERAR TOKEN (admin_reset_participant_token) */
    function clearOneTimeResetToken(){
      oneTimeResetToken=null;
      const el=document.getElementById('oneTimeTokenDisplay');
      if(el)el.textContent='-----';
      const box=document.getElementById('oneTimeTokenBox');
      if(box)box.classList.add('hidden');
    }

    function renderRecoverToken(box){
      box.innerHTML=`
        <h3>Recuperar token do participante</h3>
        <p class="small">Busque pelo WhatsApp, confirme os dados do cliente e gere um novo token. O novo código é exibido apenas uma vez e não é salvo no navegador.</p>

        <div class="tool-box">
          <div class="row">
            <div class="field">
              <label class="input-label" for="recoverWhatsappInput">WhatsApp do cliente</label>
              <input id="recoverWhatsappInput" placeholder="Ex: 88999999999 ou (88) 99999-9999" inputmode="tel" maxlength="25">
            </div>
            <div style="align-self:flex-end">
              <button type="button" class="btn" id="searchParticipantBtn" onclick="searchParticipantForReset()">
                <i data-lucide="search" size="17"></i> Buscar
              </button>
            </div>
          </div>

          <div id="resetConfirmationArea" class="hidden"></div>
          <div id="oneTimeTokenBox" class="token-reveal-box hidden">
            <p style="color:#475569;font-size:12px;font-weight:700;margin:0">NOVO TOKEN (EXIBIÇÃO ÚNICA)</p>
            <strong id="oneTimeTokenDisplay">-----</strong>
            <p style="color:#475569;font-size:12px;margin:0 0 12px">Copie agora e envie ao cliente. Ao ocultar/fechar, ele não poderá ser exibido novamente por esta tela.</p>
            <div class="row" style="justify-content:center">
              <button type="button" class="btn" onclick="copyOneTimeResetToken()">
                <i data-lucide="copy" size="16"></i> Copiar novo token
              </button>
              <button type="button" class="btn secondary" onclick="clearOneTimeResetToken()">
                <i data-lucide="eye-off" size="16"></i> Ocultar token
              </button>
            </div>
          </div>
        </div>
      `;
      if(window.lucide)lucide.createIcons();
    }

    async function searchParticipantForReset(){
      if(!adminUser)return toast('Sessão administrativa não encontrada.');
      clearOneTimeResetToken();
      pendingTokenResetTarget=null;

      const rawWhatsapp=document.getElementById('recoverWhatsappInput').value.trim();
      const digits=normalizePhoneDigits(rawWhatsapp);
      if(digits.length<8)return toast('Informe um WhatsApp válido.');

      const btn=document.getElementById('searchParticipantBtn');
      btn.disabled=true;
      btn.textContent='Buscando...';

      const {data,error}=await db
        .from('participants')
        .select('id,full_name,whatsapp,created_at');

      btn.innerHTML='<i data-lucide="search" size="17"></i> Buscar';
      btn.disabled=false;
      if(window.lucide)lucide.createIcons();

      if(error){
        console.error('Erro ao buscar participante:',error);
        return toast('Não foi possível buscar o cliente: '+error.message);
      }

      const matches=(data||[]).filter(p=>normalizePhoneDigits(p.whatsapp)===digits);
      const area=document.getElementById('resetConfirmationArea');

      if(!matches.length){
        area.classList.add('hidden');
        area.innerHTML='';
        return toast('Nenhum cliente cadastrado encontrado com esse WhatsApp.');
      }

      const client=matches[0];
      pendingTokenResetTarget={
        id:client.id,
        full_name:client.full_name,
        whatsapp:client.whatsapp,
        rpcWhatsapp:client.whatsapp||rawWhatsapp
      };

      area.classList.remove('hidden');
      area.innerHTML=`
        <div class="confirm-box">
          <div class="small" style="color:var(--accent-light);font-weight:700">CONFIRMAÇÃO DO CLIENTE</div>
          <p style="color:#fff;font-weight:700;font-size:15px;margin:6px 0 2px">${escapeHTML(client.full_name)}</p>
          <p class="small" style="margin:0">WhatsApp: <strong style="color:#e2e8f0">${escapeHTML(client.whatsapp)}</strong></p>
          <p class="small" style="margin:2px 0 12px">Cadastro: ${client.created_at?new Date(client.created_at).toLocaleDateString('pt-BR'):'—'}</p>
          <div class="row">
            <button type="button" class="btn green" id="generateNewTokenBtn" onclick="confirmAndGenerateNewToken()">
              <i data-lucide="refresh-cw" size="17"></i> Gerar novo token
            </button>
            <button type="button" class="btn secondary" onclick="cancelTokenReset()">Cancelar</button>
          </div>
        </div>
      `;
      if(window.lucide)lucide.createIcons();
    }

    function cancelTokenReset(){
      pendingTokenResetTarget=null;
      const area=document.getElementById('resetConfirmationArea');
      if(area){
        area.classList.add('hidden');
        area.innerHTML='';
      }
    }

    async function confirmAndGenerateNewToken(){
      if(!adminUser)return toast('Sessão administrativa não encontrada.');
      if(!pendingTokenResetTarget)return toast('Busque e confirme o cliente primeiro.');

      const btn=document.getElementById('generateNewTokenBtn');
      if(btn){
        btn.disabled=true;
        btn.textContent='Gerando...';
      }

      const payloadWhatsapp=pendingTokenResetTarget.rpcWhatsapp;
      const {data,error}=await db.rpc('admin_reset_participant_token',{
        p_whatsapp:payloadWhatsapp
      });

      if(error){
        console.error('Erro ao resetar token:',error);
        if(btn){
          btn.disabled=false;
          btn.innerHTML='<i data-lucide="refresh-cw" size="17"></i> Gerar novo token';
          if(window.lucide)lucide.createIcons();
        }
        return toast('Não foi possível gerar novo token: '+error.message);
      }

      const newToken=data?.new_token
        ||(Array.isArray(data)?data[0]?.new_token:null);

      if(!newToken){
        if(btn){
          btn.disabled=false;
          btn.innerHTML='<i data-lucide="refresh-cw" size="17"></i> Gerar novo token';
          if(window.lucide)lucide.createIcons();
        }
        return toast('O banco não retornou o new_token.');
      }

      pendingTokenResetTarget=null;
      const area=document.getElementById('resetConfirmationArea');
      if(area){
        area.classList.add('hidden');
        area.innerHTML='';
      }

      oneTimeResetToken=String(newToken);
      const tokenBox=document.getElementById('oneTimeTokenBox');
      const tokenEl=document.getElementById('oneTimeTokenDisplay');
      if(tokenEl)tokenEl.textContent=oneTimeResetToken;
      if(tokenBox)tokenBox.classList.remove('hidden');
      if(window.lucide)lucide.createIcons();

      toast('Novo token gerado! Exibição única.');
    }

    async function copyOneTimeResetToken(){
      if(!oneTimeResetToken)return toast('Nenhum token disponível para copiar.');
      try{
        await navigator.clipboard.writeText(oneTimeResetToken);
        toast('Novo token copiado!');
      }catch(e){
        toast('Não foi possível copiar automaticamente.');
      }
    }

    /* 2. CONSULTAR NÚMERO (admin_lookup_raffle_number) */
    function renderNumberLookup(box){
      box.innerHTML=`
        <h3>Consultar número (01 a 100)</h3>
        <p class="small">Digite um número de 01 a 100 para verificar o status atual e o histórico completo de pedidos.</p>

        <div class="tool-box">
          <div class="row">
            <div class="field" style="max-width:220px">
              <label class="input-label" for="lookupNumberInput">Número (01 a 100)</label>
              <input id="lookupNumberInput" type="number" min="1" max="100" step="1" placeholder="Ex: 07">
            </div>
            <div style="align-self:flex-end">
              <button type="button" class="btn" id="lookupNumberBtn" onclick="lookupRaffleNumber()">
                <i data-lucide="search" size="17"></i> Consultar
              </button>
            </div>
          </div>

          <div id="lookupNumberResult" style="margin-top:16px"></div>
        </div>
      `;
      if(window.lucide)lucide.createIcons();
    }

    async function lookupRaffleNumber(){
      if(!adminUser)return toast('Sessão administrativa não encontrada.');
      const raw=document.getElementById('lookupNumberInput').value.trim();
      const num=Number(raw);
      if(!Number.isInteger(num)||num<1||num>100){
        return toast('Informe um número válido de 01 a 100.');
      }

      const btn=document.getElementById('lookupNumberBtn');
      btn.disabled=true;
      btn.textContent='Consultando...';

      const {data,error}=await db.rpc('admin_lookup_raffle_number',{
        p_number:num
      });

      btn.innerHTML='<i data-lucide="search" size="17"></i> Consultar';
      btn.disabled=false;
      if(window.lucide)lucide.createIcons();

      if(error){
        console.error('Erro ao consultar número:',error);
        return toast('Erro na consulta: '+error.message);
      }

      const resultBox=document.getElementById('lookupNumberResult');
      if(!data){
        resultBox.innerHTML='<p class="small">Nenhum dado retornado para o número '+String(num).padStart(2,'0')+'.</p>';
        return;
      }

      const payload=Array.isArray(data)?(data[0]||{}):data;
      const numberLabel=String(payload.number ?? payload.number_id ?? num).padStart(2,'0');
      const currentStatus=payload.status ?? payload.number_status ?? 'desconhecido';
      const history=Array.isArray(payload.orders)
        ? payload.orders
        : Array.isArray(payload.history)
          ? payload.history
          : [];

      resultBox.innerHTML=`
        <div class="order" style="border:1px solid var(--border);border-radius:14px;padding:16px;background:rgba(19,28,49,0.7)">
          <div class="row" style="justify-content:space-between">
            <div>
              <strong style="font-size:17px;color:#fff">Número ${escapeHTML(numberLabel)}</strong>
              ${statusBadge(currentStatus)}
            </div>
            <span class="small">${history.length} registro(s) no histórico</span>
          </div>

          <h3 style="margin-top:16px">Histórico de pedidos</h3>
          ${!history.length
            ? '<p class="small">Nenhum pedido encontrado para este número.</p>'
            : `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Nome</th>
                      <th>WhatsApp</th>
                      <th>Valor</th>
                      <th>Data</th>
                      <th>Situação</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${history.map(item=>{
                      const name=item.customer_name||item.full_name||item.participant_name||'Cliente sem cadastro';
                      const whatsapp=item.customer_whatsapp||item.whatsapp||'—';
                      const amount=item.total_amount ?? item.amount ?? 0;
                      const dateRaw=item.created_at || item.order_date || item.date;
                      const dateText=dateRaw?new Date(dateRaw).toLocaleString('pt-BR'):'—';
                      const sit=item.status ?? item.order_status ?? '—';
                      return `
                        <tr>
                          <td>${escapeHTML(name)}</td>
                          <td>${escapeHTML(whatsapp)}</td>
                          <td>${money(amount)}</td>
                          <td>${escapeHTML(dateText)}</td>
                          <td>${statusBadge(sit)}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `
          }
        </div>
      `;
    }

    /* VENDA MANUAL */
    function renderManualSale(box){
      manualSelected=[];
      box.innerHTML=`
        <h3>Registrar venda sem cadastro</h3>
        <p>Use esta opção para pessoas que não querem criar token. A venda será registrada como paga e aprovada imediatamente.</p>
        <div class="row">
          <div class="field"><input id="manualName" placeholder="Nome da pessoa" maxlength="100"></div>
          <div class="field"><input id="manualWhatsapp" placeholder="WhatsApp com DDD" maxlength="20"></div>
        </div>
        <p><strong>Selecione os números disponíveis:</strong></p>
        <div class="numbers" id="manualNumbers"></div>
        <div class="summary">
          <div><div class="small">Selecionados</div><strong id="manualCount">0</strong></div>
          <div><div class="small">Total</div><div class="price" id="manualPrice">R$ 0,00</div></div>
          <button class="btn green" id="manualSaveBtn" onclick="saveManualSale()" disabled>Registrar venda paga</button>
        </div>
      `;
      renderManualNumbers();
    }

    function renderManualNumbers(){
      const grid=document.getElementById('manualNumbers');
      if(!grid)return;
      grid.innerHTML='';

      numbersData.forEach(n=>{
        const b=document.createElement('button');
        b.className='number';
        b.textContent=String(n.id).padStart(2,'0');
        if(n.status==='sold'){
          b.classList.add('sold');
          b.disabled=true;
          b.title='Já vendido';
        }else if(manualSelected.includes(n.id)){
          b.classList.add('selected');
        }
        b.onclick=()=>{
          if(n.status==='sold')return;
          if(manualSelected.includes(n.id))
            manualSelected=manualSelected.filter(x=>x!==n.id);
          else
            manualSelected.push(n.id);
          renderManualNumbers();
          updateManualSummary();
        };
        grid.appendChild(b);
      });

      updateManualSummary();
    }

    function updateManualSummary(){
      const count=manualSelected.length;
      const countEl=document.getElementById('manualCount');
      const priceEl=document.getElementById('manualPrice');
      const saveBtn=document.getElementById('manualSaveBtn');
      if(!countEl)return;
      countEl.textContent=count;
      priceEl.textContent=money(priceFor(count));
      saveBtn.disabled=!count;
    }

    async function saveManualSale(){
      if(!adminUser)return toast('Sessão administrativa não encontrada.');
      const name=document.getElementById('manualName').value.trim();
      const whatsapp=document.getElementById('manualWhatsapp').value.trim();

      if(name.length<3)return toast('Informe o nome da pessoa.');
      if(whatsapp.length<8)return toast('Informe um WhatsApp válido.');
      if(!manualSelected.length)return toast('Selecione pelo menos um número.');

      const numbers=[...manualSelected].sort((a,b)=>a-b);
      if(!confirm(
        'Confirma o recebimento do pagamento de '+money(priceFor(numbers.length))+
        ' e a venda dos números '+
        numbers.map(n=>String(n).padStart(2,'0')).join(', ')+'?'
      ))return;

      const btn=document.getElementById('manualSaveBtn');
      btn.disabled=true;
      btn.textContent='Registrando...';

      const {data,error}=await db.rpc('admin_create_manual_sale',{
        p_name:name,
        p_whatsapp:whatsapp,
        p_numbers:numbers
      });

      if(error){
        console.error('Erro na venda manual:',error);
        btn.disabled=false;
        btn.textContent='Registrar venda paga';
        return toast('Não foi possível registrar: '+error.message);
      }

      if(!data||!data.success){
        btn.disabled=false;
        btn.textContent='Registrar venda paga';
        return toast('O banco não confirmou a venda.');
      }

      toast('Venda manual registrada! Total: '+money(data.total));
      await loadAdmin();
      currentAdminTab='manual';
      document.querySelectorAll('#adminPanel .tab')
        .forEach(b=>b.classList.remove('active'));
      const manualTabButton=[...document.querySelectorAll('#adminPanel .tab')]
        .find(b=>b.textContent.includes('Venda manual'));
      if(manualTabButton)manualTabButton.classList.add('active');
      renderAdminTab();
    }

    /* NÚMEROS DOS PEDIDOS ADMIN */
    async function loadOrderNumbers(orderId){
      const {data,error}=await db.from('order_numbers')
        .select('number_id').eq('order_id',orderId);
      if(error){
        console.error(error);
        return;
      }
      const box=document.getElementById('orderNumbers-'+orderId);
      if(box){
        box.textContent='Números: '+(data||[])
          .map(x=>String(x.number_id).padStart(2,'0')).join(', ');
      }
    }

    /* APROVAR E REJEITAR */
    async function approveOrder(orderId){
      if(!confirm('Confirma que o pagamento foi verificado e deseja aprovar este pedido?'))
        return;

      const {data,error}=await db.rpc('approve_raffle_order',{
        p_order_id:orderId
      });
      if(error){
        console.error(error);
        return toast('Não foi possível aprovar: '+error.message);
      }
      toast('Pedido aprovado e números vendidos.');
      await loadAdmin();
    }

    async function rejectOrder(orderId){
      if(!confirm('Deseja realmente rejeitar este pedido?'))return;

      const {data,error}=await db.rpc('reject_raffle_order',{
        p_order_id:orderId
      });
      if(error){
        console.error(error);
        return toast('Não foi possível rejeitar: '+error.message);
      }
      toast('Pedido rejeitado.');
      await loadAdmin();
    }

    /* RECUPERAÇÃO DA SESSÃO ADMINISTRATIVA */
    async function restoreAdminSession(){
      const {data,error}=await db.auth.getSession();
      if(error){
        console.error('Erro ao recuperar sessão:',error);
        openAdminLogin();
        return;
      }

      const user=data.session?.user;
      if(!user){
        openAdminLogin();
        return;
      }

      const {data:admin,error:adminError}=await db
        .from('admin_users')
        .select('id')
        .eq('id',user.id)
        .maybeSingle();

      console.log('RECUPERAÇÃO - USUÁRIO:',user.id);
      console.log('RECUPERAÇÃO - ADMIN:',admin);
      console.log('RECUPERAÇÃO - ERRO:',adminError);

      if(adminError){
        console.error('Não foi possível verificar a sessão administrativa:',adminError);
        openAdminLogin();
        return;
      }

      if(admin){
        adminUser=user;
        document.getElementById('adminPanel').classList.remove('hidden');
        await loadAdmin();
      }else{
        await db.auth.signOut();
        openAdminLogin();
      }
    }

    /* INICIALIZAÇÃO */
    document.addEventListener('DOMContentLoaded',async()=>{
      if(window.lucide)lucide.createIcons();
      await restoreAdminSession();
    });
  </script>
</body>
</html>
