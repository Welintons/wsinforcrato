<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testador de HTML</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
  h1 { font-size: 16px; color: #38bdf8; }
  .btn { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .btn:hover { background: #0369a1; }
  .container { display: flex; flex: 1; overflow: hidden; }
  textarea { width: 50%; height: 100%; background: #090d16; color: #38bdf8; border: none; border-right: 1px solid #334155; padding: 15px; font-family: monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; }
  iframe { width: 50%; height: 100%; background: white; border: none; }
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    textarea { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid #334155; }
    iframe { width: 100%; height: 50%; }
  }
</style>
</head>
<body>

  <header>
    <h1>Testador de HTML Simples</h1>
    <button class="btn" onclick="executarTelaCheia()">▶ Executar Tela Cheia</button>
  </header>

  <div class="container">
    <textarea id="codigo" placeholder="Cole seu código HTML, CSS e JS aqui..."></textarea>
    <iframe id="preview"></iframe>
  </div>

<script>
  const textarea = document.getElementById('codigo');
  const preview = document.getElementById('preview');

  // Atualiza o preview automaticamente enquanto digita
  textarea.addEventListener('input', () => {
    preview.srcdoc = textarea.value;
  });

  function executarTelaCheia() {
    const codigo = textarea.value;
    const win = window.open('', '_blank');
    win.document.write(codigo);
    win.document.close();
  }

  // Código padrão de exemplo
  textarea.value = `<!DOCTYPE html>
<html>
<head>
<style>
  body { text-align: center; font-family: sans-serif; margin-top: 50px; background: #f43f5e; color: white; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; }
</style>
</head>
<body>
  <h1>Olá, Mundo!</h1>
  <button onclick="alert('Funcionando!')">Clique</button>
</body>
</html>`;
  
  preview.srcdoc = textarea.value;
</script>

</body>
</html>
