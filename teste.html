<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Plataforma</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#f43f5e', 600: '#e11d48', 700: '#be123c' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-fire text-brand-500 text-2xl"></i>
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-brand-500 to-orange-500 bg-clip-text text-transparent">ADULTVIBE</span>
            </div>
            <div class="hidden md:flex items-center flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Pesquisar modelos, categorias..." class="w-full bg-zinc-950 text-sm text-zinc-200 pl-10 pr-4 py-2 rounded-full border border-zinc-800 focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-full text-sm font-semibold transition shadow-lg shadow-brand-600/20">
                    Área VIP
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Categorias Dinâmicas -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 scrollbar-none" id="categoriesContainer">
            <button onclick="filterCategory('Todos')" class="cat-btn bg-brand-600 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow transition">Todos</button>
            <button onclick="filterCategory('Em Alta')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-zinc-800 transition">Em Alta</button>
            <button onclick="filterCategory('VIP')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-zinc-800 transition">VIP Exclusivo</button>
            <button onclick="filterCategory('4K Ultra')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border border-zinc-800 transition">4K Ultra</button>
        </div>

        <!-- Grid Onde os Vídeos são Injetados via JavaScript -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
            <!-- Os cards entram aqui de forma automática -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 py-6 mt-12 text-center text-xs text-zinc-500">
        <p>&copy; 2026 AdultVibe. Conteúdo restrito para maiores de 18 anos.</p>
    </footer>

    <!-- Script de Simulação de API / Banco de Dados Local -->
    <script>
        // Simulando dados que viriam de uma API JSON externa
        const databaseVideos = [
            {
                id: 1,
                title: "Sessão Privada de Estúdio - Bastidores Completos",
                model: "Helena Vance",
                duration: "18:40",
                views: "64.2k",
                tag: "Em Alta",
                quality: "4K",
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80"
            },
            {
                id: 2,
                title: "Encontro na Cobertura - Câmera Privada Parte 1",
                model: "Camila Rossi",
                duration: "24:15",
                views: "112k",
                tag: "VIP",
                quality: "HD",
                image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=700&q=80"
            },
            {
                id: 3,
                title: "Ensaio Sensual Externo ao Pôr do Sol",
                model: "Natália Lima",
                duration: "12:05",
                views: "28.9k",
                tag: "Em Alta",
                quality: "4K",
                image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=80"
            },
            {
                id: 4,
                title: "Conteúdo Exclusivo para Assinantes - Uncut Edition",
                model: "Bruna Siqueira",
                duration: "32:00",
                views: "210k",
                tag: "VIP",
                quality: "4K",
                image: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=700&q=80"
            },
            {
                id: 5,
                title: "Bastidores do Ensaio Fotográfico de Outono",
                model: "Júlia Mendes",
                duration: "15:20",
                views: "45.1k",
                tag: "Em Alta",
                quality: "HD",
                image: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=700&q=80"
            },
            {
                id: 6,
                title: "Momento Relax na Piscina - Álbum Completo",
                model: "Amanda Costa",
                duration: "21:10",
                views: "88.3k",
                tag: "VIP",
                quality: "HD",
                image: "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=700&q=80"
            }
        ];

        const gridElement = document.getElementById('videoGrid');

        function renderVideos(items) {
            gridElement.innerHTML = '';
            if (items.length === 0) {
                gridElement.innerHTML = `<p class="col-span-full text-center text-zinc-500 py-10">Nenhum vídeo encontrado.</p>`;
                return;
            }

            items.forEach(video => {
                const card = document.createElement('div');
                card.className = "group bg-zinc-900/60 rounded-xl overflow-hidden border border-zinc-800 hover:border-zinc-700 transition flex flex-col cursor-pointer";
                card.innerHTML = `
                    <div class="relative aspect-video overflow-hidden bg-zinc-950">
                        <img src="${video.image}" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-2 py-0.5 rounded font-semibold text-zinc-200">${video.duration}</span>
                        <span class="absolute top-2 left-2 ${video.tag === 'VIP' ? 'bg-yellow-600' : 'bg-brand-600'} text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${video.quality}</span>
                    </div>
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <h3 class="font-semibold text-sm line-clamp-2 text-zinc-100 group-hover:text-brand-400 transition">${video.title}</h3>
                        <div class="mt-3 flex items-center justify-between text-xs text-zinc-400 pt-2 border-t border-zinc-800/60">
                            <span class="flex items-center text-zinc-300">
                                <i class="fa-solid fa-circle-check text-brand-500 mr-1"></i> ${video.model}
                            </span>
                            <span>${video.views} views</span>
                        </div>
                    </div>
                `;
                gridElement.appendChild(card);
            });
        }

        // Filtro por Categoria
        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white', 'shadow');
                btn.classList.add('bg-zinc-900', 'text-zinc-300', 'border', 'border-zinc-800');
            });
            event.target.classList.remove('bg-zinc-900', 'text-zinc-300', 'border', 'border-zinc-800');
            event.target.classList.add('bg-brand-600', 'text-white', 'shadow');

            if (category === 'Todos') {
                renderVideos(databaseVideos);
            } else {
                const filtered = databaseVideos.filter(v => v.tag === category || (category === '4K Ultra' && v.quality === '4K'));
                renderVideos(filtered);
            }
        }

        // Funcionalidade de Busca em Tempo Real
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const results = databaseVideos.filter(v => 
                v.title.toLowerCase().includes(term) || v.model.toLowerCase().includes(term)
            );
            renderVideos(results);
        });

        // Inicializa a listagem na abertura
        renderVideos(databaseVideos);
    </script>
</body>
</html>
