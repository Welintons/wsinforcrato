
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="robots" content="noindex,nofollow">

    <title>NexusChat</title>

    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131c2e;
            --blue: #3b82f6;
            --muted: #94a3b8;
            --green: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(59,130,246,.12),
                    transparent 45%
                ),
                var(--bg);
            color: #f8fafc;
            font-family: Inter, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 21px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 10px 35px rgba(37,99,235,.25);
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 7px;
        }

        .loading-area {
            margin-top: 42px;
        }

        .loading-track {
            height: 4px;
            width: 100%;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            width: 35%;
            height: 100%;
            background: var(--blue);
            border-radius: inherit;
            animation: loading 1.2s ease-in-out infinite;
        }

        @keyframes loading {
            0% {
                transform: translateX(-110%);
            }

            100% {
                transform: translateX(390%);
            }
        }

        .status {
            color: var(--muted);
            font-size: 12px;
            margin-top: 15px;
        }

        .error {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid rgba(239,68,68,.25);
            border-radius: 12px;
            background: rgba(239,68,68,.08);
            color: #fca5a5;
            font-size: 12px;
            line-height: 1.6;
        }

        .retry {
            display: none;
            margin: 12px auto 0;
            padding: 10px 18px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .footer {
            margin-top: 55px;
            font-size: 10px;
            color: #475569;
        }

        body.failed .loading-area {
            display: none;
        }

        body.failed .error,
        body.failed .retry {
            display: block;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">N</div>

        <div class="brand">NexusChat</div>

        <div class="subtitle">
            Sua comunicação em um só lugar.
        </div>

        <section class="loading-area">
            <div class="loading-track">
                <div class="loading-bar"></div>
            </div>

            <div class="status" id="status">
                Verificando autenticação...
            </div>
        </section>

        <div class="error" id="error">
            Não foi possível verificar sua sessão.
            Verifique sua conexão e tente novamente.
        </div>

        <button class="retry" id="retry" type="button">
            Tentar novamente
        </button>

        <footer class="footer">
            NEXUSCHAT · AMBIENTE SEGURO
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <script>
        (() => {
            "use strict";

            const status = document.getElementById("status");
            const retry = document.getElementById("retry");

            let checking = false;

            function fail(message) {
                document.body.classList.add("failed");
                document.getElementById("error").textContent = message;
            }

            async function verifyAccess() {
                if (checking) return;

                checking = true;
                document.body.classList.remove("failed");

                status.textContent = "Verificando autenticação...";

                try {
                    const supabase = window.nexusSupabase;

                    if (!supabase) {
                        throw new Error(
                            "Conexão com o sistema indisponível."
                        );
                    }

                    // 1. Verificar autenticação
                    const { data: sessionData, error: sessionError } =
                        await supabase.auth.getSession();

                    if (sessionError) throw sessionError;

                    const session = sessionData.session;

                    if (!session) {
                        status.textContent =
                            "Redirecionando para acesso...";

                        window.location.replace("./login.html");
                        return;
                    }

                    // 2. Consultar perfil do usuário autenticado
                    status.textContent = "Verificando seu perfil...";

                    const userId = session.user.id;

                    const { data: profile, error: profileError } =
                        await supabase
                            .from("profiles")
                            .select("id, full_name, username, phone")
                            .eq("id", userId)
                            .maybeSingle();

                    if (profileError) {
                        throw profileError;
                    }

                    // 3. Verificar se o perfil existe e está completo
                    const perfilCompleto =
                        profile &&
                        profile.full_name?.trim() &&
                        profile.username?.trim() &&
                        profile.phone?.trim();

                    if (!perfilCompleto) {
                        status.textContent =
                            "Redirecionando para configuração do perfil...";

                        window.location.replace(
                            "./configurar-perfil.html"
                        );

                        return;
                    }

                    // 4. Tudo certo: abrir o NexusChat
                    status.textContent =
                        "Tudo pronto. Entrando no NexusChat...";

                    window.location.replace("./interface.html");

                } catch (error) {
                    console.error("NexusChat Gate:", error);

                    fail(
                        "Não foi possível verificar seu acesso. " +
                        "Verifique sua conexão ou tente novamente. " +
                        (error.message || "")
                    );

                } finally {
                    checking = false;
                }
            }

            retry.addEventListener("click", verifyAccess);

            verifyAccess();

        })();
    </script>

</body>
</html>
