
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0f">
    <title>Criar conta - NexusChat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 390px;
            padding: 32px 25px;
            background: #15151d;
            border: 1px solid #292936;
            border-radius: 18px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 29px;
            letter-spacing: -1px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .logo p {
            color: #9292a3;
            font-size: 13px;
            margin-top: 8px;
        }

        h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .description {
            color: #9292a3;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #d5d5df;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #343442;
            border-radius: 10px;
            outline: none;
            background: #20202a;
            color: #fff;
            font-size: 15px;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-top: 17px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #123b2a;
            color: #86efac;
            border: 1px solid #166534;
        }

        .message.error {
            display: block;
            background: #401b24;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }

        .login {
            margin-top: 25px;
            text-align: center;
            color: #9292a3;
            font-size: 13px;
        }

        .login a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: bold;
        }

        .terms {
            margin-top: 20px;
            color: #777786;
            font-size: 11px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="logo">
            <h1>Nexus<span>Chat</span></h1>
            <p>Conecte-se com pessoas.</p>
        </header>

        <h2>Criar sua conta</h2>

        <p class="description">
            Informe seus dados para começar.
        </p>

        <form id="registerForm">

            <div class="field">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" id="submitButton">
                Criar conta
            </button>

        </form>

        <div id="message" class="message" role="status"></div>

        <div class="login">
            Já possui uma conta?
            <a href="./login.html">Entrar</a>
        </div>

        <p class="terms">
            Ao criar sua conta, você concorda com os termos
            de uso e a política de privacidade do NexusChat.
        </p>

    </main>

    <script>
        (() => {
            "use strict";

            const supabase = window.nexusSupabase;

            const form = document.getElementById("registerForm");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const submitButton = document.getElementById("submitButton");
            const message = document.getElementById("message");

            function showMessage(text, type) {
                message.textContent = text;
                message.className = "message " + type;
            }

            if (!supabase) {
                showMessage(
                    "Não foi possível conectar ao sistema. Verifique o arquivo supabase.js.",
                    "error"
                );

                submitButton.disabled = true;
                return;
            }

            async function checkSession() {
                try {
                    const { data, error } = await supabase.auth.getSession();

                    if (error) throw error;

                    if (data.session) {
                        window.location.replace("./index.html");
                    }
                } catch (error) {
                    console.error("Erro ao verificar sessão:", error);
                }
            }

            checkSession();

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showMessage(
                        "Preencha todos os campos.",
                        "error"
                    );
                    return;
                }

                if (password.length < 6) {
                    showMessage(
                        "A senha precisa ter pelo menos 6 caracteres.",
                        "error"
                    );
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = "Criando conta...";
                message.className = "message";
                message.textContent = "";

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password
                    });

                    if (error) throw error;

                    if (!data.user) {
                        throw new Error(
                            "Não foi possível confirmar a criação da conta."
                        );
                    }

                    form.reset();

                    showMessage(
                        "Conta criada com sucesso! " +
                        "Se o sistema solicitar confirmação, verifique seu e-mail. " +
                        "Você será encaminhado para o login.",
                        "success"
                    );

                    submitButton.textContent = "Cadastro concluído";

                    setTimeout(() => {
                        window.location.replace("./login.html");
                    }, 2500);

                } catch (error) {
                    console.error("Erro no cadastro:", error);

                    showMessage(
                        error.message || "Não foi possível criar sua conta.",
                        "error"
                    );

                    submitButton.disabled = false;
                    submitButton.textContent = "Criar conta";
                }
            });

        })();
    </script>

</body>
</html>
