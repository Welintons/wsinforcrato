
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">

    <title>Criar conta - NexusChat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .card {
            background: #131c2e;
            border: 1px solid #263449;
            border-radius: 16px;
            padding: 26px 22px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 9px;
            padding: 0 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border .2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        input::placeholder {
            color: #64748b;
        }

        .hint {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 7px;
        }

        .phone-error {
            color: #f87171;
            font-size: 11px;
            margin-top: 7px;
            display: none;
        }

        .button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 9px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s;
        }

        .button:hover {
            background: #2563eb;
        }

        .button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 17px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #fecaca;
            background: #7f1d1d33;
            border: 1px solid #991b1b;
        }

        .message.success {
            display: block;
            color: #bbf7d0;
            background: #14532d33;
            border: 1px solid #166534;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 13px;
        }

        .footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .terms {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">N</div>

        <header class="header">
            <h1>Criar conta</h1>
            <p>Entre para o NexusChat</p>
        </header>

        <section class="card">

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="field">
                    <label for="username">Nome de usuário</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Ex: welington123"
                        minlength="3"
                        maxlength="30"
                        pattern="[a-zA-Z0-9_]{3,30}"
                        autocomplete="username"
                        required
                    >
                    <small class="hint">
                        De 3 a 30 caracteres. Letras, números e _.
                    </small>
                </div>

                <div class="field">
                    <label for="phone">Número de celular</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="(88) 98765-4321"
                        inputmode="numeric"
                        maxlength="15"
                        autocomplete="tel-national"
                        required
                    >
                    <small class="hint">
                        DDD + número com 9 dígitos iniciais.
                    </small>
                    <small id="phoneError" class="phone-error">
                        Informe um celular com DDD e exatamente 11 dígitos.
                    </small>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Mínimo de 8 caracteres"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="button" id="submitButton">
                    Criar minha conta
                </button>

            </form>

            <p class="terms">
                Ao criar sua conta, você concorda em utilizar o NexusChat
                de maneira responsável.
            </p>

        </section>

        <footer class="footer">
            Já possui uma conta?
            <a href="./login.html">Entrar</a>
        </footer>

    </main>

    <script>
        "use strict";

        const supabase = window.nexusSupabase;

        const form = document.getElementById("registerForm");
        const usernameInput = document.getElementById("username");
        const phoneInput = document.getElementById("phone");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");
        const phoneError = document.getElementById("phoneError");

        if (!supabase) {
            showMessage(
                "Não foi possível conectar ao sistema. Verifique o supabase.js.",
                "error"
            );

            submitButton.disabled = true;
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "message";
        }

        function getPhoneDigits(value) {
            return value.replace(/\D/g, "");
        }

        phoneInput.addEventListener("input", () => {
            const digits = getPhoneDigits(phoneInput.value).slice(0, 11);

            let formatted = digits;

            if (digits.length > 2) {
                formatted =
                    "(" + digits.slice(0, 2) + ") " + digits.slice(2);
            }

            if (digits.length > 7) {
                formatted =
                    "(" +
                    digits.slice(0, 2) +
                    ") " +
                    digits.slice(2, 7) +
                    "-" +
                    digits.slice(7, 11);
            }

            phoneInput.value = formatted;

            phoneError.style.display = "none";
            phoneInput.setCustomValidity("");
        });

        function validatePhone(value) {
            const digits = getPhoneDigits(value);

            return /^[1-9]{2}9[0-9]{8}$/.test(digits);
        }

        phoneInput.addEventListener("blur", () => {
            if (!phoneInput.value) return;

            if (!validatePhone(phoneInput.value)) {
                phoneError.style.display = "block";

                phoneInput.setCustomValidity(
                    "Informe um celular brasileiro válido com 11 dígitos."
                );
            } else {
                phoneError.style.display = "none";
                phoneInput.setCustomValidity("");
            }
        });

        async function checkSession() {
            if (!supabase) return;

            try {
                const { data, error } = await supabase.auth.getSession();

                if (error) throw error;

                if (data.session) {
                    window.location.replace("./interface.html");
                }
            } catch (error) {
                console.error("Erro ao verificar sessão:", error);
            }
        }

        checkSession();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            clearMessage();

            if (!supabase) {
                showMessage(
                    "Conexão com o Supabase indisponível.",
                    "error"
                );
                return;
            }

            const username = usernameInput.value.trim();
            const phone = getPhoneDigits(phoneInput.value);
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {
                showMessage(
                    "Nome de usuário inválido. Use de 3 a 30 caracteres.",
                    "error"
                );

                usernameInput.focus();
                return;
            }

            if (!validatePhone(phone)) {
                phoneError.style.display = "block";

                phoneInput.setCustomValidity(
                    "Informe um celular brasileiro válido com 11 dígitos."
                );

                phoneInput.reportValidity();
                phoneInput.focus();
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "A senha precisa ter pelo menos 8 caracteres.",
                    "error"
                );

                passwordInput.focus();
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Criando conta...";

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,

                    options: {
                        data: {
                            username: username,
                            full_name: username,
                            phone: phone
                        }
                    }
                });

                if (error) throw error;

                if (data.session) {
                    showMessage(
                        "Conta criada com sucesso! Entrando...",
                        "success"
                    );

                    setTimeout(() => {
                        window.location.replace("./interface.html");
                    }, 1000);

                } else {
                    showMessage(
                        "Cadastro recebido! Verifique seu e-mail para confirmar a conta.",
                        "success"
                    );

                    submitButton.textContent = "Cadastro realizado";
                }

            } catch (error) {
                console.error("Erro no cadastro:", error);

                let errorMessage = "Não foi possível criar sua conta.";

                if (
                    error.message?.toLowerCase().includes("already registered") ||
                    error.message?.toLowerCase().includes("already exists")
                ) {
                    errorMessage = "Este e-mail já está cadastrado.";

                } else if (
                    error.message?.toLowerCase().includes("password")
                ) {
                    errorMessage = "A senha não atende aos requisitos.";

                } else if (
                    error.message?.toLowerCase().includes("email")
                ) {
                    errorMessage = "Verifique o endereço de e-mail informado.";

                } else if (error.message) {
                    errorMessage = error.message;
                }

                showMessage(errorMessage, "error");

                submitButton.disabled = false;
                submitButton.textContent = "Criar minha conta";
            }
        });
    </script>

</body>
</html>
