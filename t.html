<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f4f5fa;color:#191b20;
 font-family:Arial,sans-serif;
}
header{
 padding:30px 20px 18px;
 position:sticky;top:0;z-index:5;
 background:#f4f5fa;
}
h1{font-size:29px;margin:0 0 8px}
.sub{font-size:13px;color:#737782;margin-bottom:20px}
input{
 width:100%;padding:17px;border:0;
 border-radius:18px;background:#e5e7ef;
 font-size:16px;outline:none;
}
main{padding:0 15px 30px}
.device{
 background:#dce5ff;padding:19px;
 border-radius:22px;margin-bottom:20px;
}
.device strong{font-size:19px}
.device p{font-size:13px;color:#56627c;margin:7px 0 0}
.category{margin-bottom:24px}
.category h2{font-size:17px;margin:20px 5px 12px}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px;
}
button{
 border:0;background:white;
 border-radius:17px;
 min-height:105px;padding:13px 10px;
 text-align:left;color:#20232a;
 cursor:pointer;
}
button:active{background:#e4e8f2}
.ico{font-size:24px;display:block;margin-bottom:10px}
.name{font-weight:700;font-size:13px;display:block}
.desc{font-size:10px;color:#858994;display:block;margin-top:5px}
footer{text-align:center;color:#92949c;font-size:12px;padding:20px}
.hidden{display:none!important}
#contador{font-size:12px;color:#777;margin:12px 4px}
</style>

// Renderizar os 100 botões
const painel = document.getElementById("painel");

categorias.forEach((categoria,index)=>{

 const section=document.createElement("section");
 section.className="category";

 const titulo=document.createElement("h2");
 titulo.textContent=categoria.nome;

 const grid=document.createElement("div");
 grid.className="grid";

 categoria.itens.forEach(item=>{

  const btn=document.createElement("button");
  btn.className="atalho";
  btn.dataset.nome=item[0].toLowerCase();
  btn.dataset.categoria=categoria.nome.toLowerCase();

  btn.innerHTML=`
   <span class="ico">${item[1]}</span>
   <span class="name">${item[0]}</span>
   <span class="desc">Abrir configuração</span>
  `;

  btn.onclick=()=>abrir(item[2]);

  grid.appendChild(btn);
 });

 section.appendChild(titulo);
 section.appendChild(grid);
 painel.appendChild(section);
});

// Abrir Intent
function abrir(destino){

 // Atalhos para aplicativos por pacote
 if(!destino.startsWith("android.settings.")){
  const url =
  "intent://#Intent;package="+destino+
  ";action=android.intent.action.MAIN"+
  ";category=android.intent.category.LAUNCHER;end";

  window.location.href=url;
  return;
 }

 // Configurações nativas Android
 const url =
 "intent://#Intent;action="+destino+";end";

 window.location.href=url;
}

// Pesquisa
function filtrar(){

 const termo=document.getElementById("pesquisa")
 .value.toLowerCase().trim();

 let encontrados=0;

 document.querySelectorAll(".category").forEach(section=>{

  let visiveis=0;

  section.querySelectorAll(".atalho").forEach(btn=>{

   const nome=btn.dataset.nome;
   const categoria=btn.dataset.categoria;

   const mostrar=nome.includes(termo) ||
   categoria.includes(termo);

   btn.classList.toggle("hidden",!mostrar);

   if(mostrar){
    visiveis++;
    encontrados++;
   }
  });

  section.classList.toggle("hidden",visiveis===0);
 });

 document.getElementById("contador").textContent=
 encontrados+" atalhos encontrados";
}
