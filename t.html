<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Launcher</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 18px 100px;
 background:#101827;color:white;
 font-family:Arial,sans-serif;
}
.clock{font-size:52px;font-weight:bold}
#date{color:#aab8cc}
h2{margin-top:30px}
.search{
 background:#263449;padding:16px;
 border-radius:30px;margin:25px 0;
 color:#aab8cc;
}
.apps{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:27px 8px;
}
.app{
 text-decoration:none;color:white;
 display:flex;flex-direction:column;
 align-items:center;gap:8px;
 font-size:12px;text-align:center;
}
.icon{
 width:58px;height:58px;border-radius:19px;
 display:flex;align-items:center;
 justify-content:center;font-size:28px;
}
.dock{
 position:fixed;bottom:12px;left:15px;right:15px;
 background:#263449;border-radius:25px;
 padding:17px;display:flex;
 justify-content:space-around;
}
.dock a{font-size:25px;text-decoration:none}
</style>
</head>
<body>

<div class="clock" id="clock">00:00</div>
<div id="date"></div>

<h2>Olá! 👋</h2>
<p style="color:#aab8cc">Sua central de aplicativos</p>

<div class="search">🔎 Pesquisar aplicativos</div>

<h3>Todos os aplicativos</h3>

<div class="apps" id="apps"></div>

<div class="dock">
<a href="intent://com.android.chrome/#Intent;scheme=android-app;end">🌐</a>
<a href="intent://com.google.android.youtube/#Intent;scheme=android-app;end">▶️</a>
<a href="intent://com.whatsapp/#Intent;scheme=android-app;end">💬</a>
<a href="intent://com.sec.android.app.camera/#Intent;scheme=android-app;end">📷</a>
</div>

<script>
const aplicativos = [
["Chrome","com.android.chrome","🌐","#4285F4"],
["YouTube","com.google.android.youtube","▶️","#e53935"],
["Arquivos","com.sec.android.app.myfiles","📁","#d69e28"],
["WhatsApp","com.whatsapp","💬","#20b96c"],

["Assistente","com.google.android.googlequicksearchbox","🎙️","#4285F4"],
["Apple Music","com.apple.android.music","🎵","#e94368"],
["Google Fotos","com.google.android.apps.photos","🌈","#4285F4"],
["Gmail","com.google.android.gm","✉️","#e64b42"],

["Maps","com.google.android.apps.maps","📍","#34a853"],
["Relógio","com.sec.android.app.clockpackage","⏰","#64748b"],
["Calendário","com.google.android.calendar","📅","#4285F4"],
["Play Store","com.android.vending","🛍️","#20a4d8"],

["Câmera","com.sec.android.app.camera","📷","#64748b"],
["Configurações","com.android.settings","⚙️","#8995a5"],
["Telefone","com.samsung.android.dialer","📞","#20b96c"],
["Mensagens","com.google.android.apps.messaging","💬","#4285F4"],

["Samsung Internet","com.sec.android.app.sbrowser","🌍","#448aff"],
["YouTube Music","com.google.android.apps.youtube.music","🎧","#e53935"],
["Drive","com.google.android.apps.docs","📂","#34a853"],
["Contatos","com.samsung.android.app.contacts","👤","#4285F4"]
];

const grade=document.getElementById("apps");

aplicativos.forEach(([nome,pacote,emoji,cor])=>{
 const a=document.createElement("a");
 a.className="app";
 a.href=`intent://${pacote}/#Intent;scheme=android-app;end`;

 const icone=document.createElement("div");
 icone.className="icon";
 icone.style.background=cor;
 icone.textContent=emoji;

 const texto=document.createElement("span");
 texto.textContent=nome;

 a.append(icone,texto);
 grade.appendChild(a);
});

function atualizar(){
 const agora=new Date();
 document.getElementById("clock").textContent=
 agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 document.getElementById("date").textContent=
 agora.toLocaleDateString("pt-BR",{
 weekday:"long",day:"numeric",month:"long"
 });
}
atualizar();
setInterval(atualizar,1000);
</script>

</body>
</html>
