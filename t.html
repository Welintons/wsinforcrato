<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f4f5f9;color:#191b20;
}
header{
 padding:30px 20px 16px;
 background:#f4f5f9;position:sticky;
 top:0;z-index:5;
}
h1{font-size:29px;margin:0 0 8px}
.subtitle{font-size:13px;color:#777;margin-bottom:18px}
.search{
 width:100%;padding:17px 20px;
 border:0;border-radius:18px;
 background:#e5e7ee;font-size:16px;outline:none;
}
main{padding:0 15px 35px}
.device{

 border-radius:22px;margin-bottom:18px;
}
.device strong{font-size:19px}
.device p{margin:7px 0 0;font-size:13px;color:#56627c}
.section-title{

}
.item{
 display:flex;align-items:center;gap:14px;
 padding:15px 13px;background:white;
 border-radius:18px;margin-bottom:8px;
 cursor:pointer;transition:.15s;
}
.item:active{background:#e5e9f2}
.ico{
 width:43px;height:43px;
 border-radius:50%;background:#eef0f8;
 display:grid;place-items:center;
 font-size:21px;flex-shrink:0;
}
.info{flex:1;min-width:0}
.info strong{font-size:14px;display:block}
.info small{font-size:11px;color:#777;display:block;margin-top:5px}
.arrow{font-size:23px;color:#858994}
.hidden{display:none!important}
footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style>
</head>

// Criar interface

const lista=document.getElementById("lista");

categorias.forEach(cat=>{

 const titulo=document.createElement("div");
 titulo.className="section-title";
 titulo.textContent=cat.nome;
 lista.appendChild(titulo);

 cat.itens.forEach(item=>{

  const el=document.createElement("div");
  el.className="item";

  el.innerHTML=`
  <div class="ico">${item[1]}</div>
  <div class="info">
  <strong>${item[0]}</strong>
  <small>Toque para abrir</small>
  </div>
  <span class="arrow">›</span>`;

  el.dataset.nome=item[0].toLowerCase();
  el.dataset.categoria=cat.nome.toLowerCase();

  el.onclick=()=>executar(item);

  lista.appendChild(el);
 });
});

// ABERTURA ORIGINAL PRESERVADA

function abrir(acao){
 const url='intent:#Intent;action='+acao+';end';
 window.location.href=url;
}

function abrirIntent(url){
 window.location.href=url;
}

// Bluetooth: ação oficial com pacote de Configurações.
// Alternativa: botão Conexões alternativas.

function abrirBluetooth(){
 const url='intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;package=com.android.settings;end';
 window.location.href=url;
}

function executar(item){

 const tipo=item[2];
 const destino=item[3];

 if(tipo==="action"){
  abrir(destino);
 }

 if(tipo==="known"){
  abrirIntent(destino);
 }

 if(tipo==="app"){
  abrirIntent(
   'intent://'+destino+'/#Intent;scheme=android-app;end'
  );
 }

 if(tipo==="bluetooth"){
  abrirBluetooth();
 }
}

// Pesquisa original melhorada

function pesquisar(){

 const termo=document.getElementById("search")
 .value.toLowerCase().trim();

 document.querySelectorAll("#lista .item").forEach(item=>{

  const texto=item.innerText.toLowerCase();
  const categoria=item.dataset.categoria;

  item.classList.toggle(
   "hidden",
   !texto.includes(termo) &&
   !categoria.includes(termo)
  );
 });

 document.querySelectorAll("#lista .section-title")
 .forEach(titulo=>{

  let proximo=titulo.nextElementSibling;
  let temVisivel=false;

  while(proximo && !proximo.classList.contains("section-title")){
   if(!proximo.classList.contains("hidden")){
    temVisivel=true;
   }
   proximo=proximo.nextElementSibling;
  }

  titulo.classList.toggle("hidden",!temVisivel);
 });
}
