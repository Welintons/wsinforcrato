<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Launcher</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;padding:25px 20px;
 min-height:100vh;
}
.clock{font-size:48px;font-weight:bold}
h2{margin-top:35px}
.search{
 background:#263449;padding:17px;border-radius:30px;
 color:#aab8cc;margin:25px 0;
}
.apps{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:30px 12px;
}
.app{
 text-decoration:none;color:white;text-align:center;
 display:flex;flex-direction:column;align-items:center;
 gap:9px;font-size:13px;
}
.icon{
 width:65px;height:65px;border-radius:20px;
 display:flex;align-items:center;justify-content:center;
 font-size:30px;
}
.dock{
 position:fixed;bottom:20px;left:20px;right:20px;
 background:#263449;border-radius:25px;
 padding:20px;display:flex;justify-content:space-around;
}
</style>
</head>
<body>

<div class="clock" id="clock">00:00</div>
<div id="date"></div>

<h2>Olá! 👋</h2>
<p style="color:#aab8cc">Sua central de aplicativos</p>

<div class="search">🔎 Pesquisar aplicativos</div>

<h3>Aplicativos</h3>

<div class="apps">

<a class="app" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.android.chrome;end">
<div class="icon" style="background:#4285F4">🌐</div>
Chrome
</a>

<a class="app" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.google.android.youtube;end">
<div class="icon" style="background:#e53935">▶️</div>
YouTube
</a>

<a class="app" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.sec.android.app.myfiles;end">
<div class="icon" style="background:#d69e28">📁</div>
Arquivos
</a>

<a class="app" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.whatsapp;end">
<div class="icon" style="background:#20b96c">💬</div>
WhatsApp
</a>

<a class="app" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.sec.android.app.camera;end">
<div class="icon" style="background:#64748b">📷</div>
Câmera
</a>

<a class="app" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.android.settings;end">
<div class="icon" style="background:#52647d">⚙️</div>
Configurações
</a>

</div>

<div class="dock">
<span>📞</span>
<span>💬</span>
<span>📷</span>
<span>🌐</span>
</div>

<script>
function updateClock(){
 const now=new Date();
 document.getElementById("clock").textContent=
 now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 document.getElementById("date").textContent=
 now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
}
updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
