<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS Soluções — Portal do Cliente & Admin</title>
    
    <!-- Tailwind CSS (CDN para alta performance sem compilação pesada) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0c',
                        cardbg: '#121216',
                        neoncyan: '#00f2fe',
                        neonblue: '#4facfe',
                    }
                }
            }
        }
    </script>
    
    <!-- Ícones (Lucide / FontAwesome ou similar se precisar, por ora usando SVG puro) -->
    <style>
        body { background-color: #0a0a0c; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20 md:pb-0">

    <!-- CABEÇALHO / HEADER -->
    <header class="bg-cardbg border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-neoncyan font-bold text-xl tracking-wider">⚡ WS SOLUÇÕES</span>
        </div>
        <!-- Botão do Menu Lateral (Hamburguer) -->
        <button id="menu-btn" class="text-gray-300 hover:text-neoncyan focus:outline-none p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (Muda dinamicamente via JS) -->
    <main id="app-content" class="flex-1 p-4 max-w-4xl mx-auto w-full">
        <!-- O conteúdo da aba ativa entra aqui -->
        <div class="text-center py-12">
            <h2 class="text-2xl font-bold mb-2">Carregando o sistema...</h2>
            <p class="text-gray-400">Identificando sessão e preparando sua bancada.</p>
        </div>
    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR (Bottom Bar - Foco no Cliente) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-cardbg border-t border-gray-800 flex justify-around items-center p-3 z-40 md:hidden">
        <button onclick="switchTab('inicio')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan">
            <span class="text-xs mt-1">Início</span>
        </button>
        <button onclick="switchTab('aparelhos')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan">
            <span class="text-xs mt-1">Aparelhos</span>
        </button>
        <button onclick="switchTab('orcamento')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan">
            <span class="text-xs mt-1">Pedir</span>
        </button>
        <button onclick="switchTab('agendamentos')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan">
            <span class="text-xs mt-1">Agenda</span>
        </button>
        <button onclick="switchTab('perfil')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan">
            <span class="text-xs mt-1">Perfil</span>
        </button>
    </nav>

    <!-- SCRIPT PRINCIPAL DO APP -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
