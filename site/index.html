<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS Soluções - Agende seu Horário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cyanAccent: '#00f2fe',
                        blueAccent: '#4facfe'
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md p-6 rounded-2xl shadow-2xl border border-gray-800">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold bg-gradient-to-r from-cyanAccent to-blueAccent bg-clip-text text-transparent">
                WS SOLUÇÕES
            </h1>
            <p class="text-xs text-gray-400 mt-1">Selecione o serviço e agende seu horário</p>
        </div>

        <form id="auto-agendamento" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Seu Nome</label>
                <input type="text" id="cliente" required placeholder="Ex: João Silva" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyanAccent focus:outline-none">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Escolha o Serviço</label>
                <select id="servico" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyanAccent focus:outline-none">
                    <option value="Instalação de Câmeras / Segurança">Instalação de Câmeras / Segurança</option>
                    <option value="Instalação de Forro PVC">Instalação de Forro PVC</option>
                    <option value="Manutenção de Eletrodomésticos">Manutenção de Eletrodomésticos</option>
                    <option value="Serviço Elétrico / Geral">Serviço Elétrico / Geral</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Data Desejada</label>
                    <input type="date" id="data" required class="w-full bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyanAccent focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Horário</label>
                    <select id="hora" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyanAccent focus:outline-none">
                        <option value="08:00">08:00</option>
                        <option value="10:00">10:00</option>
                        <option value="14:00">14:00</option>
                        <option value="16:00">16:00</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Seu WhatsApp (com DDD)</label>
                <input type="tel" id="whatsapp" required placeholder="(88) 99999-9999" class="w-full bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyanAccent focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-cyanAccent to-blueAccent text-gray-950 font-bold p-3 rounded-lg text-sm hover:opacity-95 transition shadow-lg shadow-cyan-500/20 mt-2">
                Confirmar Agendamento via WhatsApp 🚀
            </button>
        </form>
    </div>

    <script>
        // Definir data mínima como hoje
        document.getElementById('data').min = new Date().toISOString().split('T')[0];

        document.getElementById('auto-agendamento').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const cliente = document.getElementById('cliente').value;
            const servico = document.getElementById('servico').value;
            const data = document.getElementById('data').value.split('-').reverse().join('/');
            const hora = document.getElementById('hora').value;
            const meuWhatsApp = '5588999999999'; // Substitua pelo seu número real

            const texto = `Olá! Meu nome é *${cliente}*.\nQuero agendar o serviço: *${servico}*.\nData: *${data}* às *${hora}*. Está disponível?`;
            const url = `https://wa.me/${meuWhatsApp}?text=${encodeURIComponent(texto)}`;
            
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
