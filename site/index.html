<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS Soluções — Portal do Cliente</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0c',
                        cardbg: '#121216',
                        neoncyan: '#00f2fe',
                        neonblue: '#4facfe',
                    }
                }
            }
        }
    </script>
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-darkbg text-gray-100">

    <!-- CABEÇALHO (Oculto na tela de login, aparece após entrar) -->
    <header id="app-header" class="hidden bg-cardbg border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-neoncyan font-bold text-xl tracking-wider">⚡ WS SOLUÇÕES</span>
        </div>
        <button onclick="handleLogout()" class="text-xs text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg hover:bg-red-500/10 transition">
            Sair
        </button>
    </header>

    <!-- CONTEÚDO DINÂMICO (Inicia com a Tela de Login) -->
    <main id="app-content" class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col justify-center">
        <!-- Injetado via JS -->
    </main>

    <!-- NAVEGAÇÃO INFERIOR (Oculta na tela de login, aparece após entrar) -->
    <nav id="app-nav" class="hidden fixed bottom-0 left-0 right-0 bg-cardbg border-t border-gray-800 flex justify-around items-center p-3 z-40">
        <button onclick="switchTab('inicio')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan transition">
            <span class="text-xs mt-1">Início</span>
        </button>
        <button onclick="switchTab('aparelhos')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan transition">
            <span class="text-xs mt-1">Aparelhos</span>
        </button>
        <button onclick="switchTab('orcamento')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan transition">
            <span class="text-xs mt-1">Pedir</span>
        </button>
        <button onclick="switchTab('agendamentos')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan transition">
            <span class="text-xs mt-1">Agenda</span>
        </button>
        <button onclick="switchTab('perfil')" class="flex flex-col items-center text-gray-400 hover:text-neoncyan transition">
            <span class="text-xs mt-1">Perfil</span>
        </button>
    </nav>

    <!-- SCRIPT PRINCIPAL -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
