<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS SOLUÇÕES | Acesso</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #080d18;
    --panel: #101a2b;
    --input: #0b1423;
    --blue: #168cff;
    --cyan: #20d9e8;
    --text: #f3f7ff;
    --muted: #91a0b8;
    --border: #26364e;
    --danger: #ff6262;
    --success: #37d99a;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, #102c50 0%, transparent 45%),
        var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 410px;
}

.logo {
    text-align: center;
    margin-bottom: 28px;
}

.logo-icon {
    width: 65px;
    height: 65px;
    margin: auto auto 13px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    font-size: 25px;
    font-weight: 800;
    color: white;
    box-shadow: 0 8px 35px #168cff40;
}

.logo h1 {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo h1 span {
    color: var(--cyan);
}

.logo p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 7px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 27px;
    box-shadow: 0 20px 70px #0007;
}

.card h2 {
    font-size: 21px;
    margin-bottom: 7px;
}

.subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 25px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #bdc9dc;
    margin-bottom: 8px;
}

.field input {
    width: 100%;
    height: 47px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 13px;
    color: white;
    font-size: 14px;
    outline: none;
    transition: .2s;
}

.field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px #168cff20;
}

.field input::placeholder {
    color: #65758d;
}

.btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(100deg, var(--blue), #0874db);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.btn:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
}

.btn:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

.btn-secondary {
    background: #1c2a40;
    border: 1px solid var(--border);
}

.links {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
    font-size: 12px;
}

.links a {
    color: var(--cyan);
    text-decoration: none;
    cursor: pointer;
}

.links a:hover {
    text-decoration: underline;
}

.message {
    display: none;
    padding: 12px;
    margin-bottom: 17px;
    border-radius: 9px;
    font-size: 12px;
    line-height: 1.5;
}

.message.error {
    display: block;
    background: #ff62621a;
    border: 1px solid #ff626255;
    color: #ff9999;
}

.message.success {
    display: block;
    background: #37d99a18;
    border: 1px solid #37d99a55;
    color: #65e9b3;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000b;
    padding: 15px;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
}

.modal.active {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 440px;
    max-height: 94vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 25px;
    position: relative;
    animation: aparecer .2s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 22px;
}

.modal-header h2 {
    font-size: 20px;
}

.modal-header p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
}

.close {
    border: none;
    background: transparent;
    color: white;
    font-size: 27px;
    cursor: pointer;
    line-height: 1;
}

.progress {
    display: flex;
    gap: 7px;
    margin-bottom: 22px;
}

.progress span {
    height: 4px;
    flex: 1;
    border-radius: 10px;
    background: #26364e;
}

.progress span.active {
    background: var(--cyan);
}

.step {
    display: none;
}

.step.active {
    display: block;
}

.step-title {
    color: var(--cyan);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 17px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 12px;
}

.grid .full {
    grid-column: 1 / -1;
}

.step-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.step-buttons button {
    flex: 1;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 11px;
    margin-top: 23px;
}

@media(max-width: 380px) {
    .card {
        padding: 21px;
    }

    .modal-content {
        padding: 19px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">WS</div>
        <h1>WS <span>SOLUÇÕES</span></h1>
        <p>Seu atendimento começa aqui.</p>
    </div>

    <div class="card">

        <h2>Bem-vindo!</h2>
        <p class="subtitle">Entre na sua conta para continuar.</p>

        <div id="loginMessage" class="message"></div>

        <form id="loginForm">

            <div class="field">
                <label>E-mail</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="seuemail@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label>Senha</label>
                <input
                    type="password"
                    id="loginSenha"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="btn" id="btnLogin" type="submit">
                Entrar na minha conta
            </button>

        </form>

        <div class="links">
            <a id="btnEsqueci">Esqueci minha senha</a>
            <a id="btnAbrirCadastro">Criar conta</a>
        </div>

    </div>

    <div class="footer">
        WS SOLUÇÕES © 2026
    </div>

</div>


<!-- MODAL CADASTRO -->

<div class="modal" id="modalCadastro">

    <div class="modal-content">

        <div class="modal-header">
            <div>
                <h2>Criar minha conta</h2>
                <p>Preencha seus dados para começar.</p>
            </div>

            <button class="close" id="btnFecharCadastro" type="button">
                &times;
            </button>
        </div>

        <div class="progress">
            <span id="progress1" class="active"></span>
            <span id="progress2"></span>
        </div>

        <div id="cadastroMessage" class="message"></div>

        <form id="cadastroForm">

            <!-- ETAPA 1 -->

            <div class="step active" id="register1">

                <div class="step-title">01 — Dados pessoais</div>

                <div class="field">
                    <label>Nome completo</label>
                    <input
                        type="text"
                        id="cadNome"
                        placeholder="Seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label>E-mail</label>
                    <input
                        type="email"
                        id="cadEmail"
                        placeholder="seuemail@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label>WhatsApp</label>
                    <input
                        type="tel"
                        id="cadTelefone"
                        placeholder="(88) 99999-9999"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="field">
                    <label>Senha</label>
                    <input
                        type="password"
                        id="cadSenha"
                        placeholder="Mínimo de 6 caracteres"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="field">
                    <label>Confirmar senha</label>
                    <input
                        type="password"
                        id="cadConfirmarSenha"
                        placeholder="Digite novamente"
                        required
                    >
                </div>

                <button class="btn" id="btnProximaEtapa" type="button">
                    Continuar
                </button>

            </div>


            <!-- ETAPA 2 -->

            <div class="step" id="register2">

                <div class="step-title">02 — Endereço</div>

                <div class="grid">

                    <div class="field full">
                        <label>Cidade</label>
                        <input
                            type="text"
                            id="cadCidade"
                            placeholder="Sua cidade"
                            required
                        >
                    </div>

                    <div class="field full">
                        <label>Bairro</label>
                        <input
                            type="text"
                            id="cadBairro"
                            placeholder="Seu bairro"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Rua</label>
                        <input
                            type="text"
                            id="cadRua"
                            placeholder="Nome da rua"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Número</label>
                        <input
                            type="text"
                            id="cadNumero"
                            placeholder="Nº"
                            required
                        >
                    </div>

                </div>

                <div class="step-buttons">

                    <button
                        class="btn btn-secondary"
                        id="btnVoltarEtapa"
                        type="button"
                    >
                        Voltar
                    </button>

                    <button
                        class="btn"
                        id="btnCriarConta"
                        type="submit"
                    >
                        Criar minha conta
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<!-- MODAL RECUPERAÇÃO -->

<div class="modal" id="modalRecuperacao">

    <div class="modal-content">

        <div class="modal-header">
            <div>
                <h2>Recuperar senha</h2>
                <p>Enviaremos um link para seu e-mail.</p>
            </div>

            <button class="close" id="btnFecharRecuperacao" type="button">
                &times;
            </button>
        </div>

        <div id="recoveryMessage" class="message"></div>

        <form id="recoveryForm">

            <div class="field">
                <label>Seu e-mail</label>
                <input
                    type="email"
                    id="recoveryEmail"
                    placeholder="seuemail@email.com"
                    required
                >
            </div>

            <button class="btn" id="btnRecuperar" type="submit">
                Enviar link de recuperação
            </button>

        </form>

    </div>

</div>


<script type="module">

import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

const modalCadastro = $('modalCadastro');
const modalRecuperacao = $('modalRecuperacao');


// MENSAGENS

function mensagem(id, texto, tipo = 'error') {
    const elemento = $(id);

    elemento.textContent = texto;
    elemento.className = 'message ' + tipo;
}

function limparMensagem(id) {
    const elemento = $(id);

    elemento.textContent = '';
    elemento.className = 'message';
}


// MODAL CADASTRO

function abrirCadastro() {
    limparMensagem('cadastroMessage');
    modalCadastro.classList.add('active');
}

function fecharCadastro() {
    modalCadastro.classList.remove('active');
}

$('btnAbrirCadastro').addEventListener('click', abrirCadastro);

$('btnFecharCadastro').addEventListener('click', fecharCadastro);


// MODAL RECUPERAÇÃO

$('btnEsqueci').addEventListener('click', () => {
    limparMensagem('recoveryMessage');
    modalRecuperacao.classList.add('active');
});

$('btnFecharRecuperacao').addEventListener('click', () => {
    modalRecuperacao.classList.remove('active');
});


// FECHAR CLICANDO FORA

modalCadastro.addEventListener('click', event => {
    if (event.target === modalCadastro) fecharCadastro();
});

modalRecuperacao.addEventListener('click', event => {
    if (event.target === modalRecuperacao) {
        modalRecuperacao.classList.remove('active');
    }
});


// ETAPAS DO CADASTRO

function mostrarEtapa(numero) {

    $('register1').classList.toggle('active', numero === 1);
    $('register2').classList.toggle('active', numero === 2);

    $('progress1').classList.toggle('active', numero === 1 || numero === 2);
    $('progress2').classList.toggle('active', numero === 2);

    limparMensagem('cadastroMessage');
}

$('btnProximaEtapa').addEventListener('click', () => {

    const nome = $('cadNome').value.trim();
    const email = $('cadEmail').value.trim();
    const telefone = $('cadTelefone').value.trim();
    const senha = $('cadSenha').value;
    const confirmar = $('cadConfirmarSenha').value;

    if (!nome || !email || !telefone || !senha || !confirmar) {
        mensagem('cadastroMessage', 'Preencha todos os campos.');
        return;
    }

    if (senha.length < 6) {
        mensagem('cadastroMessage', 'A senha precisa ter pelo menos 6 caracteres.');
        return;
    }

    if (senha !== confirmar) {
        mensagem('cadastroMessage', 'As senhas não são iguais.');
        return;
    }

    mostrarEtapa(2);
});

$('btnVoltarEtapa').addEventListener('click', () => {
    mostrarEtapa(1);
});


// CADASTRO SUPABASE

$('cadastroForm').addEventListener('submit', async event => {

    event.preventDefault();

    const botao = $('btnCriarConta');

    const nome = $('cadNome').value.trim();
    const email = $('cadEmail').value.trim();
    const telefone = $('cadTelefone').value.trim();
    const senha = $('cadSenha').value;

    const cidade = $('cadCidade').value.trim();
    const bairro = $('cadBairro').value.trim();
    const rua = $('cadRua').value.trim();
    const numero = $('cadNumero').value.trim();

    if (!cidade || !bairro || !rua || !numero) {
        mensagem('cadastroMessage', 'Preencha todos os dados do endereço.');
        return;
    }

    botao.disabled = true;
    botao.textContent = 'Criando conta...';

    limparMensagem('cadastroMessage');

    try {

        const { data, error } = await supabase.auth.signUp({

            email: email,
            password: senha,

            options: {
                data: {
                    full_name: nome,
                    phone: telefone,
                    city: cidade,
                    neighborhood: bairro,
                    street: rua,
                    number: numero
                }
            }

        });

        if (error) throw error;

        if (!data.user) {
            throw new Error('O Supabase não retornou os dados do usuário.');
        }

        if (data.session) {

            mensagem(
                'cadastroMessage',
                'Conta criada com sucesso! Redirecionando...',
                'success'
            );

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);

        } else {

            mensagem(
                'cadastroMessage',
                'Cadastro realizado! Verifique seu e-mail para confirmar a conta antes de entrar.',
                'success'
            );

            botao.textContent = 'Cadastro realizado';

        }

    } catch (error) {

        console.error('Erro no cadastro:', error);

        mensagem(
            'cadastroMessage',
            error.message || 'Não foi possível criar sua conta.'
        );

        botao.disabled = false;
        botao.textContent = 'Criar minha conta';

    }

});


// LOGIN

$('loginForm').addEventListener('submit', async event => {

    event.preventDefault();

    const botao = $('btnLogin');

    const email = $('loginEmail').value.trim();
    const senha = $('loginSenha').value;

    botao.disabled = true;
    botao.textContent = 'Entrando...';

    limparMensagem('loginMessage');

    try {

        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password: senha
        });

        if (error) throw error;

        if (!data.session) {
            throw new Error('Não foi possível iniciar sua sessão.');
        }

        window.location.href = 'dashboard.html';

    } catch (error) {

        console.error('Erro no login:', error);

        mensagem(
            'loginMessage',
            error.message || 'Não foi possível entrar.'
        );

        botao.disabled = false;
        botao.textContent = 'Entrar na minha conta';

    }

});


// RECUPERAÇÃO DE SENHA

$('recoveryForm').addEventListener('submit', async event => {

    event.preventDefault();

    const botao = $('btnRecuperar');
    const email = $('recoveryEmail').value.trim();

    botao.disabled = true;
    botao.textContent = 'Enviando...';

    limparMensagem('recoveryMessage');

    try {

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/redefinir-senha.html'
        });

        if (error) throw error;

        mensagem(
            'recoveryMessage',
            'Se o endereço estiver cadastrado, você receberá um e-mail com as instruções.',
            'success'
        );

    } catch (error) {

        mensagem(
            'recoveryMessage',
            error.message || 'Não foi possível enviar o e-mail.'
        );

    } finally {

        botao.disabled = false;
        botao.textContent = 'Enviar link de recuperação';

    }

});


// VERIFICAR SESSÃO EXISTENTE

try {

    const { data } = await supabase.auth.getSession();

    if (data.session) {
        window.location.href = 'dashboard.html';
    }

} catch (error) {
    console.error('Erro ao verificar sessão:', error);
}

</script>

</body>
</html>
