<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WS Soluções</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            background: #080a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Fundo Animado com Gradientes Fluídos */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatBlob 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: #00f2fe;
            top: -10%;
            left: -10%;
            border-radius: 50%;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #4facfe;
            bottom: -15%;
            right: -10%;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* Container do Login (Glassmorphism) */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: rgba(16, 22, 34, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(0, 242, 254, 0.1);
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .login-header h2 span {
            color: #00f2fe;
        }

        .login-header p {
            color: #8a99ad;
            font-size: 14px;
        }

        /* Campos de Entrada */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(8, 10, 15, 0.6);
            border: 1px solid rgba(138, 153, 173, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .input-group svg {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #8a99ad;
            transition: fill 0.3s ease;
        }

        .input-group input:focus ~ svg {
            fill: #00f2fe;
        }

        /* Botão de Ação */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 10px;
            color: #080a0f;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Links de Rodapé */
        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .login-footer a {
            color: #8a99ad;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: #00f2fe;
        }

        /* Animação de Erro (Shake) disparada via JS */
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <!-- Fundo Fluído -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Caixa de Login -->
    <div class="login-container" id="loginCard">
        <div class="login-header">
            <h2>Área <span>Restrita</span></h2>
            <p>Entre com suas credenciais para continuar</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="E-mail ou Usuário" required autocomplete="off">
                <!-- Ícone de Usuário (SVG) -->
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required>
                <!-- Ícone de Cadeado (SVG) -->
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">ACESSAR SISTEMA</button>

            <div class="login-footer">
                <a href="#">Esqueceu a senha?</a>
                <a href="#">Criar conta</a>
            </div>
        </form>
    </div>

    <!-- JavaScript de Efeitos e Validação -->
    <script>
        const form = document.getElementById('loginForm');
        const loginCard = document.getElementById('loginCard');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simulação de verificação (exemplo simples)
            submitBtn.innerText = "Autenticando...";
            submitBtn.style.opacity = "0.7";

            setTimeout(() => {
                if (email === "admin@sistema.com" && password === "123456") {
                    submitBtn.innerText = "Sucesso! Entrando...";
                    submitBtn.style.background = "linear-gradient(135deg, #00b09b, #96c93d)";
                    submitBtn.style.boxShadow = "0 5px 15px rgba(0, 176, 155, 0.5)";
                    
                    setTimeout(() => {
                        alert("Login realizado com sucesso! (Redirecionando...)");
                        // window.location.href = "dashboard.html";
                    }, 800);
                } else {
                    // Dispara animação de erro (Shake)
                    loginCard.classList.add('shake');
                    
                    submitBtn.innerText = "ACESSAR SISTEMA";
                    submitBtn.style.opacity = "1";
                    
                    alert("Credenciais inválidas! (Dica: admin@sistema.com / 123456)");

                    // Remove a classe para permitir novo shake caso erre de novo
                    setTimeout(() => {
                        loginCard.classList.remove('shake');
                    }, 400);
                }
            }, 1000);
        });
    </script>
</body>
</html>
