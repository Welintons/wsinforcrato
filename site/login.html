<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | WS SOLUÇÕES</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Plus Jakarta Sans', 'sans-serif']
      },
      colors: {
        brand: '#f97316',
        dark: '#080d18',
        panel: '#111827'
      }
    }
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #080d18;
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

.login-card {
  background: rgba(17, 24, 39, .92);
  border: 1px solid #263244;
  box-shadow: 0 25px 80px rgba(0,0,0,.35);
}

.field {
  background: #0b1220;
  border: 1px solid #293548;
  transition: .2s;
}

.field:focus-within {
  border-color: #f97316;
  box-shadow: 0 0 0 3px rgba(249,115,22,.12);
}

.field input {
  background: transparent;
  outline: none;
  color: white;
  width: 100%;
}

.btn-login {
  background: #f97316;
  transition: .2s;
}

.btn-login:hover {
  background: #ea580c;
  transform: translateY(-1px);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.bg-effect {
  background:
    radial-gradient(circle at 20% 20%, rgba(249,115,22,.12), transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(37,99,235,.10), transparent 35%);
}

</style>
</head>

<body class="min-h-screen bg-effect flex flex-col">

<!-- CABEÇALHO -->
<header class="px-6 py-5 flex justify-between items-center max-w-7xl mx-auto w-full">

  <div class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl bg-brand flex items-center justify-center">
      <i data-lucide="zap" class="w-6 h-6 text-white"></i>
    </div>

    <div>
      <h1 class="font-extrabold text-lg tracking-tight">
        WS <span class="text-brand">SOLUÇÕES</span>
      </h1>
      <p class="text-[10px] text-gray-500 tracking-widest">
        TECNOLOGIA E SERVIÇOS
      </p>
    </div>
  </div>

  <span class="text-xs text-gray-500 flex items-center gap-2">
    <i data-lucide="shield-check" class="w-4 h-4 text-green-500"></i>
    Ambiente seguro
  </span>

</header>

<!-- CONTEÚDO -->
<main class="flex-1 flex items-center justify-center px-5 py-8">

  <div class="w-full max-w-md">

    <div class="login-card rounded-3xl p-7 sm:p-9">

      <!-- ÍCONE -->
      <div class="w-14 h-14 rounded-2xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center mb-7">
        <i data-lucide="user-round" class="w-7 h-7 text-brand"></i>
      </div>

      <div class="mb-8">
        <h2 class="text-2xl font-extrabold mb-2">
          Bem-vindo!
        </h2>

        <p class="text-sm text-gray-400">
          Acesse sua conta para acompanhar seus serviços.
        </p>
      </div>

      <!-- FORMULÁRIO -->
      <form id="loginForm" class="space-y-5">

        <div>
          <label class="text-xs font-semibold text-gray-300 block mb-2">
            E-mail
          </label>

          <div class="field flex items-center gap-3 px-4 py-3.5 rounded-xl">
            <i data-lucide="mail" class="w-5 h-5 text-gray-500"></i>

            <input
              id="email"
              type="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div>
          <div class="flex justify-between mb-2">
            <label class="text-xs font-semibold text-gray-300">
              Senha
            </label>

            <button
              type="button"
              onclick="recuperarSenha()"
              class="text-xs text-brand hover:text-orange-300"
            >
              Esqueceu a senha?
            </button>
          </div>

          <div class="field flex items-center gap-3 px-4 py-3.5 rounded-xl">

            <i data-lucide="lock" class="w-5 h-5 text-gray-500"></i>

            <input
              id="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button type="button" onclick="alternarSenha()">
              <i id="eyeIcon" data-lucide="eye" class="w-5 h-5 text-gray-500"></i>
            </button>

          </div>
        </div>

        <!-- MENSAGEM -->
        <div id="mensagem" class="hidden text-sm p-3 rounded-xl"></div>

        <!-- BOTÃO -->
        <button
          id="btnLogin"
          type="submit"
          class="btn-login w-full rounded-xl py-4 font-bold text-sm flex items-center justify-center gap-2"
        >
          <span id="btnTexto">Entrar na minha conta</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

      <div class="flex items-center gap-3 my-7">
        <div class="h-px bg-gray-700 flex-1"></div>
        <span class="text-xs text-gray-500">WS SOLUÇÕES</span>
        <div class="h-px bg-gray-700 flex-1"></div>
      </div>

      <p class="text-center text-xs text-gray-500">
        Precisa de atendimento?
        <a href="https://wa.me/" target="_blank"
           class="text-brand hover:underline">
          Fale conosco
        </a>
      </p>

    </div>

    <p class="text-center text-xs text-gray-600 mt-7">
      © 2026 WS SOLUÇÕES · Todos os direitos reservados.
    </p>

  </div>

</main>

<script>

// ===================================
// CONFIGURAÇÃO SUPABASE
// ===================================

const SUPABASE_URL = "SUA_SUPABASE_URL";
const SUPABASE_KEY = "SUA_CHAVE_ANON_PUBLIC";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ===================================
// ELEMENTOS
// ===================================

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const senha = document.getElementById("senha");
const mensagem = document.getElementById("mensagem");
const btnLogin = document.getElementById("btnLogin");
const btnTexto = document.getElementById("btnTexto");

// ===================================
// MENSAGENS
// ===================================

function mostrarMensagem(texto, tipo = "erro") {

  mensagem.classList.remove("hidden");

  mensagem.className =
    "text-sm p-3 rounded-xl " +
    (tipo === "sucesso"
      ? "bg-green-500/10 text-green-400 border border-green-500/20"
      : "bg-red-500/10 text-red-400 border border-red-500/20");

  mensagem.textContent = texto;
}

// ===================================
// MOSTRAR SENHA
// ===================================

function alternarSenha() {

  const visivel = senha.type === "password";

  senha.type = visivel ? "text" : "password";

  document.getElementById("eyeIcon")
    .setAttribute("data-lucide", visivel ? "eye-off" : "eye");

  lucide.createIcons();
}

// ===================================
// LOGIN
// ===================================

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  mensagem.classList.add("hidden");

  btnLogin.disabled = true;
  btnTexto.textContent = "Autenticando...";

  try {

    const { data, error } = await db.auth.signInWithPassword({
      email: email.value.trim(),
      password: senha.value
    });

    if (error) throw error;

    // Buscar perfil do usuário
    const { data: perfil, error: perfilErro } = await db
      .from("profiles")
      .select("nome, role")
      .eq("id", data.user.id)
      .single();

    if (perfilErro || !perfil) {

      await db.auth.signOut();

      throw new Error("Perfil não encontrado. Procure o administrador.");

    }

    mostrarMensagem("Login realizado com sucesso!", "sucesso");

    // Redirecionamento conforme permissão
    if (perfil.role === "admin") {
      window.location.replace("admin.html");
    } else {
      window.location.replace("portal.html");
    }

  } catch (error) {

    mostrarMensagem(
      error.message === "Invalid login credentials"
        ? "E-mail ou senha incorretos."
        : error.message
    );

    btnLogin.disabled = false;
    btnTexto.textContent = "Entrar na minha conta";

  }

});

// ===================================
// RECUPERAR SENHA
// ===================================

async function recuperarSenha() {

  const endereco = email.value.trim();

  if (!endereco) {
    mostrarMensagem("Digite seu e-mail primeiro.");
    email.focus();
    return;
  }

  const { error } = await db.auth.resetPasswordForEmail(
    endereco,
    {
      redirectTo: window.location.origin + "/redefinir-senha.html"
    }
  );

  if (error) {
    mostrarMensagem(error.message);
  } else {
    mostrarMensagem(
      "Se o e-mail estiver cadastrado, você receberá as instruções de recuperação.",
      "sucesso"
    );
  }

}

// ===================================
// INICIALIZAÇÃO
// ===================================

lucide.createIcons();

// Se já estiver autenticado, verificar o perfil
(async () => {

  const { data: { user } } = await db.auth.getUser();

  if (!user) return;

  const { data: perfil } = await db
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (perfil) {
    window.location.replace(
      perfil.role === "admin" ? "admin.html" : "portal.html"
    );
  }

})();

</script>

</body>
</html>
