
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS SOLUÇÕES | Acesso</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
 min-height:100vh;
 background:#080a0f;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 overflow-x:hidden
}

.background-blobs{position:fixed;inset:0;overflow:hidden;z-index:0}

.blob{
 position:absolute;
 filter:blur(80px);
 opacity:.5;
 border-radius:50%;
 animation:float 10s infinite alternate
}

.blob-1{
 width:350px;height:350px;
 background:#00f2fe;
 top:-10%;left:-10%
}

.blob-2{
 width:400px;height:400px;
 background:#4facfe;
 bottom:-15%;right:-10%;
 animation-delay:-5s
}

@keyframes float{
 to{transform:translate(50px,30px) scale(1.1)}
}

.login-container{
 position:relative;
 z-index:2;
 width:100%;
 max-width:400px;
 padding:35px;
 background:rgba(16,22,34,.8);
 backdrop-filter:blur(16px);
 border:1px solid #00f2fe33;
 border-radius:20px;
 box-shadow:0 15px 35px #0008,0 0 20px #00f2fe18;
 animation:fade .7s ease
}

@keyframes fade{
 from{opacity:0;transform:translateY(20px)}
 to{opacity:1;transform:translateY(0)}
}

.header{text-align:center;margin-bottom:28px}
.header h2{font-size:27px;letter-spacing:1px}
.header h2 span{color:#00f2fe}
.header p{color:#8a99ad;font-size:13px;margin-top:8px}

.input-group{margin-bottom:17px}

.input-group label{
 display:block;
 font-size:12px;
 color:#aab7c9;
 margin-bottom:7px
}

.input-group input{
 width:100%;
 padding:14px;
 background:#080a0fcc;
 border:1px solid #8a99ad55;
 border-radius:9px;
 color:white;
 font-size:14px;
 outline:none;
 transition:.3s
}

.input-group input:focus{
 border-color:#00f2fe;
 box-shadow:0 0 10px #00f2fe30
}

.input-group input::placeholder{color:#66758a}

.btn{
 width:100%;
 padding:15px;
 border:0;
 border-radius:10px;
 background:linear-gradient(135deg,#4facfe,#00f2fe);
 color:#080a0f;
 font-size:15px;
 font-weight:800;
 cursor:pointer;
 transition:.3s
}

.btn:hover{
 transform:translateY(-2px);
 box-shadow:0 8px 20px #00f2fe55
}

.btn:disabled{
 opacity:.5;
 cursor:not-allowed;
 transform:none
}

.links{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin-top:20px
}

.links button{
 background:none;
 border:0;
 color:#8a99ad;
 cursor:pointer;
 font-size:12px
}

.links button:hover{color:#00f2fe}

.hidden{display:none!important}

.step{
 font-size:12px;
 color:#8a99ad;
 margin-bottom:18px
}

.message{
 font-size:13px;
 padding:12px;
 border-radius:8px;
 margin-bottom:15px;
 display:none;
 line-height:1.5
}

.error{
 background:#ff444422;
 color:#ff8585;
 border:1px solid #ff444455
}

.success{
 background:#00c78b22;
 color:#70eac0;
 border:1px solid #00c78b55
}

.footer{
 text-align:center;
 color:#66758a;
 font-size:11px;
 margin-top:22px
}

@media(max-width:420px){
 .login-container{padding:27px 20px}
}
</style>
</head>

<body>

<div class="background-blobs">
 <div class="blob blob-1"></div>
 <div class="blob blob-2"></div>
</div>

<div class="login-container">

 <div class="header">
  <h2>WS <span>SOLUÇÕES</span></h2>
  <p id="subtitle">Entre com suas credenciais para continuar</p>
 </div>

 <div id="message" class="message" role="status" aria-live="polite"></div>

<!-- LOGIN -->
<form id="loginForm">

 <div class="input-group">
  <label for="loginEmail">E-mail</label>
  <input type="email" id="loginEmail" placeholder="Seu e-mail" required autocomplete="email">
 </div>

 <div class="input-group">
  <label for="loginPassword">Senha</label>
  <input type="password" id="loginPassword" placeholder="Sua senha" required autocomplete="current-password">
 </div>

 <button class="btn" id="loginBtn" type="submit">
  ACESSAR SISTEMA
 </button>

 <div class="links">
  <button type="button" data-screen="recovery">Esqueceu a senha?</button>
  <button type="button" data-screen="register1">Criar conta</button>
 </div>

</form>

<!-- CADASTRO ETAPA 1 -->
<form id="register1" class="hidden">

 <div class="step">ETAPA 1 DE 2 — Dados pessoais</div>

 <div class="input-group">
  <label for="name">Nome completo *</label>
  <input id="name" type="text" placeholder="Seu nome completo" minlength="3" required autocomplete="name">
 </div>

 <div class="input-group">
  <label for="email">E-mail *</label>
  <input id="email" type="email" placeholder="seu@email.com" required autocomplete="email">
 </div>

 <div class="input-group">
  <label for="phone">WhatsApp *</label>
  <input id="phone" type="tel" placeholder="(88) 99999-9999" maxlength="15" required autocomplete="tel">
 </div>

 <div class="input-group">
  <label for="password">Senha *</label>
  <input id="password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password">
 </div>

 <div class="input-group">
  <label for="confirmPassword">Confirmar senha *</label>
  <input id="confirmPassword" type="password" placeholder="Repita sua senha" required autocomplete="new-password">
 </div>

 <button class="btn" type="submit">CONTINUAR</button>

 <div class="links">
  <button type="button" data-screen="loginForm">Voltar ao login</button>
 </div>

</form>

<!-- CADASTRO ETAPA 2 -->
<form id="register2" class="hidden">

 <div class="step">ETAPA 2 DE 2 — Seu endereço</div>

 <div class="input-group">
  <label for="city">Cidade *</label>
  <input id="city" type="text" placeholder="Sua cidade" required>
 </div>

 <div class="input-group">
  <label for="neighborhood">Bairro *</label>
  <input id="neighborhood" type="text" placeholder="Seu bairro" required>
 </div>

 <div class="input-group">
  <label for="street">Rua / Endereço *</label>
  <input id="street" type="text" placeholder="Nome da rua ou endereço" required>
 </div>

 <div class="input-group">
  <label for="number">Número *</label>
  <input id="number" type="text" placeholder="Número da residência" required>
 </div>

 <button class="btn" id="registerBtn" type="submit">
  FINALIZAR CADASTRO
 </button>

 <div class="links">
  <button type="button" data-screen="register1">Voltar</button>
  <button type="button" data-screen="loginForm">Cancelar</button>
 </div>

</form>

<!-- RECUPERAÇÃO -->
<form id="recovery" class="hidden">

 <div class="input-group">
  <label for="recoveryEmail">E-mail cadastrado</label>
  <input type="email" id="recoveryEmail" placeholder="seu@email.com" required>
 </div>

 <button class="btn" id="recoveryBtn" type="submit">
  RECUPERAR SENHA
 </button>

 <div class="links">
  <button type="button" data-screen="loginForm">Voltar</button>
 </div>

</form>

<div class="footer">
 WS SOLUÇÕES · Atendimento e serviços
</div>

</div>

<script type="module">

import { supabase } from './supabase.js';

// INSTÂNCIA DO SUPABASE
const db = supabase;

let registration = {};

const screens = [
 "loginForm",
 "register1",
 "register2",
 "recovery"
];

// ELEMENTOS
const $ = id => document.getElementById(id);

// MENSAGENS
function message(text,type="error"){

 const el = $("message");

 el.textContent = text;
 el.className = "message " + type;
 el.style.display = "block";
}

function clearMessage(){
 $("message").style.display = "none";
}

// TROCA DE TELAS
function showScreen(id){

 screens.forEach(screen=>{
  $(screen).classList.add("hidden");
 });

 $(id).classList.remove("hidden");

 const titles = {
  loginForm:"Entre com suas credenciais para continuar",
  register1:"Crie sua conta na WS SOLUÇÕES",
  register2:"Informe seu endereço",
  recovery:"Recupere seu acesso"
 };

 $("subtitle").textContent = titles[id];

 clearMessage();
}

// DISPONIBILIZA PARA OS BOTÕES
window.showScreen = showScreen;

// NAVEGAÇÃO
document.querySelectorAll("[data-screen]").forEach(button=>{

 button.addEventListener("click",()=>{
  showScreen(button.dataset.screen);
 });

});

// UTILITÁRIOS
function digits(value){
 return value.replace(/\D/g,"");
}

// MÁSCARA WHATSAPP
$("phone").addEventListener("input",e=>{

 let v = digits(e.target.value).slice(0,11);

 if(v.length>2){
  v = "("+v.slice(0,2)+") "+v.slice(2);
 }

 if(digits(v).length===11){
  v = v.replace(/(\d{5})(\d{4})$/,"$1-$2");
 }else if(digits(v).length===10){
  v = v.replace(/(\d{4})(\d{4})$/,"$1-$2");
 }

 e.target.value = v;
});

// CADASTRO ETAPA 1
$("register1").addEventListener("submit",e=>{

 e.preventDefault();
 clearMessage();

 const name = $("name").value.trim();
 const email = $("email").value.trim();
 const phone = digits($("phone").value);
 const password = $("password").value;
 const confirm = $("confirmPassword").value;

 if(name.length<3){
  return message("Informe seu nome completo.");
 }

 if(phone.length!==10 && phone.length!==11){
  return message("WhatsApp inválido.");
 }

 if(password.length<8){
  return message("A senha precisa ter pelo menos 8 caracteres.");
 }

 if(password!==confirm){
  return message("As senhas não conferem.");
 }

 registration = {
  name,
  email,
  phone,
  password
 };

 showScreen("register2");

});

// CADASTRO ETAPA 2
$("register2").addEventListener("submit",async e=>{

 e.preventDefault();
 clearMessage();

 if(!registration.email){
  showScreen("register1");
  return message("Informe seus dados pessoais novamente.");
 }

 const city = $("city").value.trim();
 const neighborhood = $("neighborhood").value.trim();
 const street = $("street").value.trim();
 const number = $("number").value.trim();

 if(!city || !neighborhood || !street || !number){
  return message("Preencha todos os campos do endereço.");
 }

 const btn = $("registerBtn");

 btn.disabled = true;
 btn.textContent = "CRIANDO CONTA...";

 try{

  // CRIA USUÁRIO
  const {data,error} = await db.auth.signUp({

   email:registration.email,
   password:registration.password,

   options:{
    data:{
     full_name:registration.name
    }
   }

  });

  if(error) throw error;

  if(!data.user){
   throw new Error("Não foi possível criar a conta.");
  }

  // SALVA PERFIL
  // A tabela profiles deve ter RLS permitindo
  // INSERT quando id = auth.uid().

  const profile = {

   id:data.user.id,
   full_name:registration.name,
   email:registration.email,
   phone:registration.phone,
   city,
   neighborhood,
   street,
   number

  };

  // Se a confirmação de e-mail estiver ativada,
  // não existe sessão para inserir diretamente.
  // Nesse caso, o perfil deve ser criado por um
  // trigger seguro no banco de dados.

  if(data.session){

   const {error:profileError} = await db
    .from("profiles")
    .upsert(profile,{onConflict:"id"});

   if(profileError){

    console.error(profileError);

    throw new Error(
     "Conta criada, mas houve um erro ao salvar o perfil: "+profileError.message
    );

   }

  }

  const emailCadastrado = registration.email;

  registration = {};

  $("register1").reset();
  $("register2").reset();

  if(data.session){

   message(
    "Cadastro concluído! Bem-vindo à WS SOLUÇÕES.",
    "success"
   );

   setTimeout(()=>{
    location.href = "dashboard.html";
   },1500);

  }else{

   showScreen("loginForm");

   $("loginEmail").value = emailCadastrado;

   message(
    "Cadastro realizado! Confirme seu e-mail para acessar.",
    "success"
   );

  }

 }catch(error){

  console.error("Erro no cadastro:",error);

  message(error.message || "Erro ao realizar cadastro.");

 }finally{

  btn.disabled = false;
  btn.textContent = "FINALIZAR CADASTRO";

 }

});

// LOGIN
$("loginForm").addEventListener("submit",async e=>{

 e.preventDefault();
 clearMessage();

 const btn = $("loginBtn");

 btn.disabled = true;
 btn.textContent = "AUTENTICANDO...";

 try{

  const {data,error} = await db.auth.signInWithPassword({

   email:$("loginEmail").value.trim(),
   password:$("loginPassword").value

  });

  if(error) throw error;

  // VERIFICA PERFIL
  const {data:profile,error:profileError} = await db
   .from("profiles")
   .select("id")
   .eq("id",data.user.id)
   .maybeSingle();

  if(profileError) throw profileError;

  if(!profile){

   await db.auth.signOut();

   throw new Error(
    "Cadastro incompleto. Entre em contato com o suporte."
   );

  }

  location.href = "dashboard.html";

 }catch(error){

  console.error("Erro no login:",error);

  message(error.message || "Não foi possível entrar.");

 }finally{

  btn.disabled = false;
  btn.textContent = "ACESSAR SISTEMA";

 }

});

// RECUPERAÇÃO DE SENHA
$("recovery").addEventListener("submit",async e=>{

 e.preventDefault();
 clearMessage();

 const btn = $("recoveryBtn");

 btn.disabled = true;
 btn.textContent = "ENVIANDO...";

 try{

  const email = $("recoveryEmail").value.trim();

  const {error} = await db.auth.resetPasswordForEmail(email,{

   redirectTo:location.origin + "/redefinir-senha.html"

  });

  if(error) throw error;

  message(
   "Se o e-mail estiver cadastrado, você receberá as instruções.",
   "success"
  );

 }catch(error){

  console.error("Erro na recuperação:",error);

  message(error.message || "Falha na recuperação.");

 }finally{

  btn.disabled = false;
  btn.textContent = "RECUPERAR SENHA";

 }

});

// VERIFICA SESSÃO
(async()=>{

 try{

  const {data,error} = await db.auth.getSession();

  if(error) throw error;

  if(data.session){
   location.href = "dashboard.html";
  }

 }catch(error){

  console.error("Erro ao verificar sessão:",error);

  message("Não foi possível verificar sua sessão.");

 }

})();

</script>

</body>
</html>
