
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceCrato — Teste RLS 2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

<main class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6">
    <h1 class="text-2xl font-bold">FaceCrato</h1>
    <p class="text-slate-400 text-sm mb-6">Teste RLS — alteração e exclusão</p>

    <div class="space-y-3">
        <input id="email" type="email" placeholder="E-mail da Conta B"
        class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700">

        <input id="password" type="password" placeholder="Senha da Conta B"
        class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700">

        <button id="btn" onclick="testar()"
        class="w-full bg-blue-600 p-3 rounded-lg font-bold">
            Testar UPDATE e DELETE
        </button>
    </div>

    <div id="resultado" class="mt-5 text-sm space-y-3"></div>
</main>

<script>
const SUPABASE_URL = "https://tnogcviolluveumzrhyy.supabase.co";
const SUPABASE_KEY = "sb_publishable_cOoVzxE6nEJXfpOXZFhlIg_qDBWo7L1";

const POST_ID = "372f4f55-2bf5-4125-8016-62c8d7f68deb";
const CONTA_B_ID = "8fe70252-9056-4db3-a281-ab5beccd1459";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function mostrar(html) {
    document.getElementById("resultado").innerHTML += html;
}

async function testar() {
    const btn = document.getElementById("btn");
    const resultado = document.getElementById("resultado");

    btn.disabled = true;
    resultado.innerHTML = "<p class='text-yellow-400'>Autenticando...</p>";

    try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            throw new Error("Informe e-mail e senha.");
        }

        const { data: login, error: loginError } =
            await supabaseClient.auth.signInWithPassword({ email, password });

        if (loginError) throw loginError;

        if (login.user.id !== CONTA_B_ID) {
            throw new Error("A conta autenticada não é a Conta B.");
        }

        resultado.innerHTML = `
            <p class="text-green-400">Conta B autenticada.</p>
        `;

        // TESTE UPDATE
        const { data: updateData, error: updateError } = await supabaseClient
            .from("posts")
            .update({
                content: "PUBLICAÇÃO PRIVADA - TESTE DE SEGURANÇA"
            })
            .eq("id", POST_ID)
            .select("id");

        if (updateError) {
            mostrar(`
                <div class="bg-yellow-950 border border-yellow-700 p-3 rounded-lg">
                    <b class="text-yellow-300">UPDATE: erro/bloqueio</b>
                    <p>${updateError.message}</p>
                </div>
            `);
            mostrar("<p class='text-yellow-300'>DELETE não executado.</p>");
            return;
        }

        if (updateData.length > 0) {
            mostrar(`
                <div class="bg-red-950 border border-red-700 p-3 rounded-lg">
                    <b class="text-red-400">FALHA: UPDATE PERMITIDO</b>
                    <p>A Conta B conseguiu atualizar a publicação.</p>
                </div>
            `);
            return;
        }

        mostrar(`
            <div class="bg-green-950 border border-green-700 p-3 rounded-lg">
                <b class="text-green-400">UPDATE BLOQUEADO</b>
                <p>A Conta B não conseguiu alterar a publicação.</p>
            </div>
        `);

        // TESTE DELETE
        const { data: deleteData, error: deleteError } = await supabaseClient
            .from("posts")
            .delete()
            .eq("id", POST_ID)
            .select("id");

        if (deleteError) {
            mostrar(`
                <div class="bg-yellow-950 border border-yellow-700 p-3 rounded-lg">
                    <b class="text-yellow-300">DELETE: erro/bloqueio</b>
                    <p>${deleteError.message}</p>
                </div>
            `);
            return;
        }

        if (deleteData.length > 0) {
            mostrar(`
                <div class="bg-red-950 border border-red-700 p-3 rounded-lg">
                    <b class="text-red-400">FALHA: DELETE PERMITIDO</b>
                    <p>A Conta B conseguiu excluir a publicação.</p>
                </div>
            `);
            return;
        }

        mostrar(`
            <div class="bg-green-950 border border-green-700 p-3 rounded-lg">
                <b class="text-green-400">DELETE BLOQUEADO</b>
                <p>A Conta B não conseguiu excluir a publicação.</p>
            </div>
        `);

    } catch (e) {
        mostrar(`
            <div class="bg-red-950 border border-red-700 p-3 rounded-lg">
                <b class="text-red-400">ERRO</b>
                <p>${e.message}</p>
            </div>
        `);
    } finally {
        await supabaseClient.auth.signOut();
        btn.disabled = false;
    }
}
</script>

</body>
</html>
