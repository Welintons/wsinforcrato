
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceCrato — Security Lab 2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#080d18;color:#e5e7eb;font-family:Arial}
.panel{background:#111827;border:1px solid #29364a;border-radius:14px}
.field{background:#0b1220;border:1px solid #334155;color:white}
</style>
</head>
<body class="min-h-screen p-4">

<main class="max-w-2xl mx-auto space-y-4">

<header class="py-3">
<h1 class="text-2xl font-black">FaceCrato Security Lab</h1>
<p class="text-slate-400 text-sm">Bateria 2 — INSERT / UPDATE / DELETE</p>
</header>

<section class="panel p-4 space-y-3">
<h2 class="font-bold">Autenticação</h2>

<div>
<label class="text-xs text-blue-400">CONTA A</label>
<input id="emailA" type="email" placeholder="E-mail da Conta A"
class="field w-full rounded-lg p-3 mt-1 mb-2">
<input id="passA" type="password" placeholder="Senha da Conta A"
class="field w-full rounded-lg p-3">
</div>

<div>
<label class="text-xs text-purple-400">CONTA B</label>
<input id="emailB" type="email" placeholder="E-mail da Conta B"
class="field w-full rounded-lg p-3 mt-1 mb-2">
<input id="passB" type="password" placeholder="Senha da Conta B"
class="field w-full rounded-lg p-3">
</div>

<button id="run" onclick="executar()"
class="w-full bg-blue-600 rounded-lg p-3 font-bold">
Executar bateria de testes
</button>
</section>

<section class="grid grid-cols-3 gap-2">
<div class="panel p-3 text-center">
<p class="text-xs text-slate-400">Testes</p>
<strong id="total" class="text-2xl">0</strong>
</div>
<div class="panel p-3 text-center">
<p class="text-xs text-slate-400">Aprovados</p>
<strong id="ok" class="text-2xl text-green-400">0</strong>
</div>
<div class="panel p-3 text-center">
<p class="text-xs text-slate-400">Falhas</p>
<strong id="fail" class="text-2xl text-red-400">0</strong>
</div>
</section>

<section class="panel p-4">
<h2 class="font-bold mb-3">Resultados</h2>
<div id="results" class="space-y-3">
<p class="text-slate-500 text-sm">Aguardando execução.</p>
</div>
</section>

<section class="panel p-4">
<h2 class="font-bold mb-3">Log técnico</h2>
<div id="logs" class="text-xs space-y-2 max-h-64 overflow-auto">
<p class="text-slate-500">Nenhuma operação executada.</p>
</div>
</section>

</main>

<script>
const SUPABASE_URL = "https://tnogcviolluveumzrhyy.supabase.co";
const SUPABASE_KEY = "sb_publishable_cOoVzxE6nEJXfpOXZFhlIg_qDBWo7L";

const ID_A = "973c0d73-fab4-4e3d-8b9c-e001c02e0cb2";
const ID_B = "8fe70252-9056-4db3-a281-ab5beccd1459";

function criarCliente(nome) {
    return window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: false,
                autoRefreshToken: false,
                detectSessionInUrl: false,
                storageKey: "facecrato-test-" + nome
            }
        }
    );
}

let resultados = [];

function log(msg) {
    const area = document.getElementById("logs");
    if (area.querySelector(".text-slate-500")) area.innerHTML = "";

    const p = document.createElement("p");
    p.textContent = new Date().toLocaleTimeString() + " — " + msg;
    area.prepend(p);
}

function resultado(nome, estado, detalhe) {
    resultados.push({ nome, estado, detalhe });
    atualizar();
    log(nome + ": " + detalhe);
}

function atualizar() {
    document.getElementById("total").textContent = resultados.length;
    document.getElementById("ok").textContent =
        resultados.filter(x => x.estado === "ok").length;
    document.getElementById("fail").textContent =
        resultados.filter(x => x.estado === "fail").length;

    const area = document.getElementById("results");
    area.innerHTML = "";

    resultados.forEach(r => {
        const div = document.createElement("div");
        div.className = "border-b border-slate-700 pb-3";

        const titulo = document.createElement("p");
        titulo.className = "font-semibold text-sm";
        titulo.textContent = r.nome;

        const badge = document.createElement("span");
        badge.className = "text-xs font-bold " +
            (r.estado === "ok" ? "text-green-400" : "text-red-400");
        badge.textContent = r.estado === "ok" ? "APROVADO" : "FALHA";

        const detalhe = document.createElement("p");
        detalhe.className = "text-xs text-slate-400 mt-1";
        detalhe.textContent = r.detalhe;

        div.append(titulo, badge, detalhe);
        area.appendChild(div);
    });
}

async function criarPost(cliente, usuario, conteudo) {
    return await cliente.from("posts").insert({
        user_id: usuario,
        content: conteudo,
        post_type: "text",
        visibility: "private",
        comments_permission: "nobody"
    }).select("id").single();
}

async function executar() {
    const btn = document.getElementById("run");

    if (btn.disabled) return;

    const emailA = document.getElementById("emailA").value.trim();
    const passA = document.getElementById("passA").value;
    const emailB = document.getElementById("emailB").value.trim();
    const passB = document.getElementById("passB").value;

    if (!emailA || !passA || !emailB || !passB) {
        alert("Preencha os dados das duas contas.");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Executando testes...";

    resultados = [];
    atualizar();

    let a, b;
    let postA = null;
    let postB = null;
    let postFalsificado = null;

    try {
        if (!window.supabase) {
            throw new Error("Biblioteca Supabase não carregou. Verifique a internet.");
        }

        a = criarCliente("conta-a");
        b = criarCliente("conta-b");

        // AUTENTICAÇÃO A
        const loginA = await a.auth.signInWithPassword({
            email: emailA,
            password: passA
        });

        if (loginA.error) throw new Error("Login A: " + loginA.error.message);
        if (loginA.data.user.id !== ID_A) {
            throw new Error("Conta A incorreta.");
        }

        resultado("Autenticação Conta A", "ok", "UUID confirmado.");

        // AUTENTICAÇÃO B
        const loginB = await b.auth.signInWithPassword({
            email: emailB,
            password: passB
        });

        if (loginB.error) throw new Error("Login B: " + loginB.error.message);
        if (loginB.data.user.id !== ID_B) {
            throw new Error("Conta B incorreta.");
        }

        resultado("Autenticação Conta B", "ok", "UUID confirmado.");

        // INSERT A
        const criarA = await criarPost(a, ID_A, "TESTE TEMPORÁRIO SECURITY LAB A");

        if (criarA.error) throw new Error("INSERT A: " + criarA.error.message);

        postA = criarA.data.id;
        resultado("INSERT próprio — Conta A", "ok", "Publicação temporária criada.");

        // UPDATE A
        const updateA = await a.from("posts")
            .update({ content: "TESTE A — CONTEÚDO ALTERADO" })
            .eq("id", postA)
            .select("id");

        if (updateA.error) {
            resultado("UPDATE próprio — Conta A", "fail", updateA.error.message);
        } else if (updateA.data.length === 1) {
            resultado("UPDATE próprio — Conta A", "ok", "Autor conseguiu editar.");
        } else {
            resultado("UPDATE próprio — Conta A", "fail", "Nenhuma linha alterada.");
        }

        // INSERT FALSIFICADO
        const falsificado = await criarPost(
            b, ID_A, "TESTE DE FALSIFICAÇÃO DE IDENTIDADE"
        );

        if (falsificado.error) {
            const msg = falsificado.error.message;
            if (msg.toLowerCase().includes("row-level security")) {
                resultado("INSERT com identidade falsa — Conta B", "ok",
                    "RLS rejeitou a tentativa.");
            } else {
                resultado("INSERT com identidade falsa — Conta B", "fail",
                    "Recusado, mas não confirmado como bloqueio RLS: " + msg);
            }
        } else {
            postFalsificado = falsificado.data.id;
            resultado("INSERT com identidade falsa — Conta B", "fail",
                "Conta B criou registro em nome da Conta A!");
        }

        // UPDATE CRUZADO
        const updateB = await b.from("posts")
            .update({ content: "ALTERAÇÃO NÃO AUTORIZADA" })
            .eq("id", postA)
            .select("id");

        if (updateB.error) {
            resultado("UPDATE cruzado — Conta B", "fail", updateB.error.message);
        } else if (updateB.data.length === 0) {
            resultado("UPDATE cruzado — Conta B", "ok",
                "Conta B não alterou a publicação de A.");
        } else {
            resultado("UPDATE cruzado — Conta B", "fail",
                "Conta B conseguiu alterar a publicação de A!");
        }

        // DELETE CRUZADO
        const deleteB = await b.from("posts")
            .delete()
            .eq("id", postA)
            .select("id");

        if (deleteB.error) {
            resultado("DELETE cruzado — Conta B", "fail", deleteB.error.message);
        } else if (deleteB.data.length === 0) {
            resultado("DELETE cruzado — Conta B", "ok",
                "Conta B não excluiu a publicação de A.");
        } else {
            resultado("DELETE cruzado — Conta B", "fail",
                "Conta B conseguiu excluir a publicação de A!");
            postA = null;
        }

        // INSERT B
        const criarB = await criarPost(b, ID_B, "TESTE TEMPORÁRIO SECURITY LAB B");

        if (criarB.error) {
            resultado("INSERT próprio — Conta B", "fail", criarB.error.message);
        } else {
            postB = criarB.data.id;
            resultado("INSERT próprio — Conta B", "ok", "Publicação própria criada.");

            // UPDATE B
            const updateProprio = await b.from("posts")
                .update({ content: "TESTE B — CONTEÚDO ALTERADO" })
                .eq("id", postB)
                .select("id");

            if (updateProprio.error) {
                resultado("UPDATE próprio — Conta B", "fail", updateProprio.error.message);
            } else if (updateProprio.data.length === 1) {
                resultado("UPDATE próprio — Conta B", "ok", "Autor conseguiu editar.");
            } else {
                resultado("UPDATE próprio — Conta B", "fail", "Nenhuma linha alterada.");
            }

            // DELETE B
            const deleteProprio = await b.from("posts")
                .delete()
                .eq("id", postB)
                .select("id");

            if (deleteProprio.error) {
                resultado("DELETE próprio — Conta B", "fail", deleteProprio.error.message);
            } else if (deleteProprio.data.length === 1) {
                resultado("DELETE próprio — Conta B", "ok", "Autor conseguiu excluir.");
                postB = null;
            } else {
                resultado("DELETE próprio — Conta B", "fail", "Nenhuma linha excluída.");
            }
        }

    } catch (e) {
        resultado("Execução interrompida", "fail", e.message);

    } finally {
        // LIMPEZA
        if (a) {
            for (const id of [postA, postFalsificado]) {
                if (!id) continue;

                const cleanup = await a.from("posts").delete().eq("id", id);

                log(cleanup.error
                    ? "Falha na limpeza " + id + ": " + cleanup.error.message
                    : "Registro temporário removido: " + id);
            }

            await a.auth.signOut();
        }

        if (b) {
            if (postB) {
                const cleanup = await b.from("posts").delete().eq("id", postB);
                log(cleanup.error
                    ? "Falha na limpeza B: " + cleanup.error.message
                    : "Registro temporário B removido.");
            }

            await b.auth.signOut();
        }

        btn.disabled = false;
        btn.textContent = "Executar novamente";
    }
}
</script>

</body>
</html>
