
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Motos | PDV</title>

<style>
:root {
  --bg:#0b0f16;
  --panel:#121925;
  --panel2:#182233;
  --border:#29354a;
  --text:#edf2f7;
  --muted:#93a2b8;
  --purple:#7068f5;
  --green:#22c55e;
  --red:#fb7185;
  --yellow:#fbbf24;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;font-size:14px;
}
button,input,select {font:inherit}
button {cursor:pointer}
.app {max-width:1450px;margin:auto;padding:18px}
header {
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;flex-wrap:wrap;margin-bottom:20px;
}
.brand {display:flex;align-items:center;gap:12px}
.logo {
  width:48px;height:48px;border-radius:14px;
  display:grid;place-items:center;font-size:23px;font-weight:bold;
  background:linear-gradient(135deg,#6366f1,#a855f7);
}
h1 {font-size:20px;margin:0;letter-spacing:1px}
.subtitle {color:var(--muted);font-size:12px;margin-top:5px}
.header-right {display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status {color:#86efac;background:#10251b;border:1px solid #28543a;
  border-radius:10px;padding:10px}
nav {
  display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;
  border-bottom:1px solid var(--border);margin-bottom:22px;
}
.nav-btn {
  white-space:nowrap;padding:11px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--panel);color:#cbd5e1;
}
.nav-btn.active,.nav-btn:hover {
  background:#292854;border-color:var(--purple);color:white;
}
h2 {font-size:21px;margin:0}
h3 {font-size:15px;margin:0}
.muted {color:var(--muted)}
.small {font-size:12px}
.section-head {
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:16px;
}
.section-head p {color:var(--muted);margin:6px 0 0}
.stats {
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;margin-bottom:18px;
}
.stat,.panel {
  background:var(--panel);border:1px solid var(--border);
  border-radius:15px;
}
.stat {padding:16px;min-width:0}
.stat-label {color:var(--muted);font-size:12px}
.stat-value {font-size:25px;font-weight:bold;margin-top:10px;overflow-wrap:anywhere}
.stat-desc {font-size:11px;color:var(--muted);margin-top:5px}
.layout {
  display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);
  gap:16px;align-items:start;
}
.panel {overflow:hidden;min-width:0}
.panel-head {
  padding:15px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;
}
.panel-body {padding:15px}
input,select {
  width:100%;padding:11px 12px;border-radius:9px;
  background:#0b111c;color:var(--text);border:1px solid var(--border);
  outline:none;min-width:0;
}
input:focus,select:focus {border-color:var(--purple)}
.search {max-width:320px}
.btn {
  padding:10px 13px;border-radius:9px;border:0;
  font-weight:bold;display:inline-flex;justify-content:center;
  align-items:center;gap:6px;
}
.primary {background:var(--purple);color:white}
.primary:hover {filter:brightness(1.12)}
.secondary {background:#202c40;color:#e2e8f0;border:1px solid #34445d}
.danger {background:#3b1d29;color:#fecdd3;border:1px solid #6a293c}
.success {background:#14532d;color:white}
.btn:disabled {opacity:.4;cursor:not-allowed}
.btn-sm {padding:7px 9px;font-size:12px}
.full {width:100%;margin-top:12px}
.products {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
}
.product {
  background:#151e2b;border:1px solid var(--border);
  border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:11px;
}
.product-top {display:flex;justify-content:space-between;gap:8px}
.product-icon {
  width:38px;height:38px;background:#252e43;border-radius:10px;
  display:grid;place-items:center;font-size:20px;
}
.product-name {font-weight:bold;line-height:1.4}
.product-code {font-size:11px;color:var(--muted);margin-top:5px}
.stock {font-size:11px;color:#86efac;white-space:nowrap}
.stock.low {color:var(--yellow)}
.stock.out {color:var(--red)}
.product-bottom {
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-top:auto;
}
.price {font-size:17px;font-weight:bold}
.cart-items {max-height:350px;overflow:auto}
.cart-item {
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;
  padding:13px 0;border-bottom:1px solid var(--border);
}
.cart-item:last-child {border-bottom:0}
.cart-item strong {font-size:13px}
.qty {display:flex;align-items:center;gap:9px;margin-top:9px}
.qty button {
  width:26px;height:26px;border:1px solid var(--border);
  background:#263248;color:white;border-radius:7px;
}
.cart-right {text-align:right}
.cart-right strong {display:block;margin-bottom:8px}
.empty {padding:30px 10px;text-align:center;color:var(--muted)}
.summary {border-top:1px solid var(--border);padding-top:14px;margin-top:12px}
.sumrow {display:flex;justify-content:space-between;margin:9px 0;color:#bdc8d9}
.sumrow.total {font-size:23px;font-weight:bold;color:white;margin-top:14px}
label {display:block;color:var(--muted);font-size:12px;margin:14px 0 7px}
.hint {font-size:11px;color:var(--muted);line-height:1.5}
.table-wrap {overflow:auto}
table {width:100%;border-collapse:collapse;min-width:650px}
th,td {padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
th {font-size:11px;color:var(--muted);background:#101722}
td {font-size:13px}
.badge {padding:5px 8px;border-radius:20px;background:#243147;font-size:11px}
.badge.green {background:#123522;color:#86efac}
.badge.yellow {background:#3b3015;color:#fde68a}
.badge.red {background:#3b1d29;color:#fecdd3}
.module {
  padding:35px 20px;text-align:center;
}
.module .emoji {font-size:40px;margin-bottom:12px}
.module p {max-width:500px;margin:12px auto 20px;color:var(--muted);line-height:1.6}
.toast {
  display:none;position:fixed;bottom:18px;right:18px;z-index:10;
  max-width:calc(100% - 36px);padding:14px 17px;border-radius:11px;
  background:#163522;border:1px solid #2e6841;color:#bbf7d0;
  box-shadow:0 10px 30px #0008;
}
footer {text-align:center;color:#64748b;font-size:11px;padding:25px 0 8px}
@media(max-width:900px) {
  .layout {grid-template-columns:1fr}
  .stats {grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px) {
  .app {padding:12px}
  .products {grid-template-columns:1fr}
  .stat {padding:12px}
  .stat-value {font-size:21px}
  .panel-body,.panel-head {padding:12px}
  .search {max-width:100%}
  h1 {font-size:17px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">JM</div>
    <div>
      <h1>JOHN MOTOS</h1>
      <div class="subtitle">Sistema de gestão · Ponto de venda</div>
    </div>
  </div>
  <div class="header-right">
    <span class="muted small" id="today"></span>
    <span class="status" id="cashStatus">● Caixa aberto</span>
    <button class="btn secondary btn-sm" id="toggleCash">Fechar caixa</button>
  </div>
</header>

<nav>
  <button class="nav-btn active" data-page="pdv">🛒 PDV</button>
  <button class="nav-btn" data-page="estoque">📦 Estoque</button>
  <button class="nav-btn" data-page="os">🧾 Ordens de serviço</button>
  <button class="nav-btn" data-page="clientes">👥 Clientes</button>
  <button class="nav-btn" data-page="veiculos">🏍️ Veículos</button>
  <button class="nav-btn" data-page="caixa">💵 Caixa</button>
  <button class="nav-btn" data-page="relatorios">📊 Relatórios</button>
</nav>

<main id="main"></main>

<footer>John Motos · Sistema local · Dados salvos neste navegador</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const KEY = "john_motos_sistema_v1";

const initialProducts = [
 {id:1,sku:"PEC-001",name:"Pastilha de freio CG 160",category:"Freios",price:35,cost:18,stock:12,min:4,icon:"🧩"},
 {id:2,sku:"PEC-002",name:"Filtro de óleo Titan 150",category:"Filtros",price:22,cost:10,stock:2,min:5,icon:"🛢️"},
 {id:3,sku:"PEC-003",name:"Vela de ignição NGK",category:"Motor",price:28,cost:14,stock:18,min:5,icon:"⚡"},
 {id:4,sku:"PEC-004",name:"Cabo de embreagem CG",category:"Cabos",price:32,cost:16,stock:7,min:3,icon:"〰️"},
 {id:5,sku:"PEC-005",name:"Kit relação CG 160",category:"Transmissão",price:145,cost:92,stock:4,min:2,icon:"⚙️"},
 {id:6,sku:"PEC-006",name:"Lâmpada farol H4",category:"Elétrica",price:25,cost:11,stock:0,min:4,icon:"💡"},
 {id:7,sku:"PEC-007",name:"Câmara de ar aro 18",category:"Pneus",price:38,cost:21,stock:9,min:3,icon:"⭕"},
 {id:8,sku:"PEC-008",name:"Óleo 10W30 1 litro",category:"Lubrificantes",price:39,cost:25,stock:15,min:5,icon:"🛢️"}
];

function freshData() {
 return {
   products:initialProducts.map(p=>({...p})),
   sales:[],
   movements:[],
   cashOpen:true,
   nextSaleId:1
 };
}

function loadData() {
 try {
   const raw=localStorage.getItem(KEY);
   if(!raw) return freshData();
   const data=JSON.parse(raw);
   if(!Array.isArray(data.products)||!Array.isArray(data.sales)) return freshData();
   return data;
 } catch(e) {
   return freshData();
 }
}

let db=loadData();
let cart=[];
let page="pdv";
let search="";
let payment="Pix";
let toastTimer;

const $ = id => document.getElementById(id);
const money = n => Number(n||0).toLocaleString("pt-BR",{
 style:"currency",currency:"BRL"
});
const esc = value => String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);

function save() {
 try {
   localStorage.setItem(KEY,JSON.stringify(db));
 } catch(e) {
   notify("Não foi possível salvar. Verifique o espaço do navegador.");
 }
}

function notify(message) {
 const el=$("toast");
 el.textContent=message;
 el.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.display="none",3000);
}

function dateToday() {
 return new Date().toLocaleDateString("pt-BR",{
 weekday:"short",day:"2-digit",month:"short",year:"numeric"
 });
}

function salesToday() {
 const now=new Date();
 return db.sales.filter(s=>{
   const d=new Date(s.date);
   return d.getFullYear()===now.getFullYear()
    && d.getMonth()===now.getMonth()
    && d.getDate()===now.getDate();
 });
}

function totalCart() {
 return cart.reduce((sum,item)=>sum+item.price*item.qty,0);
}

function updateHeader() {
 $("today").textContent=dateToday();
 $("cashStatus").innerHTML=db.cashOpen
   ?'<span style="color:#86efac">● Caixa aberto</span>'
   :'<span style="color:#fb7185">● Caixa fechado</span>';
 $("toggleCash").textContent=db.cashOpen?"Fechar caixa":"Abrir caixa";
}

function setPage(next) {
 page=next;
 document.querySelectorAll(".nav-btn").forEach(b=>{
   b.classList.toggle("active",b.dataset.page===page);
 });
 render();
}

function render() {
 updateHeader();
 if(page==="pdv") $("main").innerHTML=renderPDV();
 else if(page==="estoque") $("main").innerHTML=renderStock();
 else if(page==="caixa") $("main").innerHTML=renderCash();
 else if(page==="relatorios") $("main").innerHTML=renderReports();
 else $("main").innerHTML=renderModule(page);
 bindPage();
}

function renderPDV() {
 const today=salesToday();
 const revenue=today.reduce((s,v)=>s+v.total,0);
 const low=db.products.filter(p=>p.stock<=p.min).length;
 const filtered=db.products.filter(p=>
   (p.name+" "+p.sku+" "+p.category).toLowerCase().includes(search.toLowerCase())
 );

 return `
 <div class="section-head">
  <div><h2>Ponto de venda</h2>
   <p>Venda de peças com baixa automática no estoque.</p>
  </div>
  <button class="btn secondary" id="clearSearch">Limpar busca</button>
 </div>

 <div class="stats">
  <div class="stat"><div class="stat-label">Vendas hoje</div>
   <div class="stat-value">${today.length}</div><div class="stat-desc">Vendas finalizadas</div></div>
  <div class="stat"><div class="stat-label">Faturamento hoje</div>
   <div class="stat-value">${money(revenue)}</div><div class="stat-desc">Total bruto</div></div>
  <div class="stat"><div class="stat-label">Produtos cadastrados</div>
   <div class="stat-value">${db.products.length}</div><div class="stat-desc">Itens no catálogo</div></div>
  <div class="stat"><div class="stat-label">Estoque baixo</div>
   <div class="stat-value">${low}</div><div class="stat-desc">Precisam de atenção</div></div>
 </div>

 <div class="layout">
  <section class="panel">
   <div class="panel-head">
    <h3>Produtos</h3>
    <input class="search" id="productSearch" placeholder="Buscar nome ou código..."
      value="${esc(search)}">
   </div>
   <div class="panel-body">
    <div class="products">
    ${filtered.length?filtered.map(p=>`
     <article class="product">
      <div class="product-top">
       <div class="product-icon">${p.icon||"📦"}</div>
       <span class="stock ${p.stock===0?"out":p.stock<=p.min?"low":""}">
        ${p.stock===0?"Sem estoque":p.stock+" un."}
       </span>
      </div>
      <div>
       <div class="product-name">${esc(p.name)}</div>
       <div class="product-code">${esc(p.sku)} · ${esc(p.category)}</div>
      </div>
      <div class="product-bottom">
       <span class="price">${money(p.price)}</span>
       <button class="btn primary btn-sm add-product" data-id="${p.id}"
        ${p.stock<=0||!db.cashOpen?"disabled":""}>＋ Adicionar</button>
      </div>
     </article>
    `).join(""):'<div class="empty">Nenhum produto encontrado.</div>'}
    </div>
   </div>
  </section>

  <section class="panel">
   <div class="panel-head">
    <h3>🛒 Carrinho</h3>
    <button class="btn secondary btn-sm" id="emptyCart" ${cart.length?"":"disabled"}>Esvaziar</button>
   </div>
   <div class="panel-body">
    <div class="cart-items">
    ${cart.length?cart.map(i=>`
     <div class="cart-item">
      <div>
       <strong>${esc(i.name)}</strong><br>
       <span class="muted small">${money(i.price)} / unidade</span>
       <div class="qty">
        <button data-action="minus" data-id="${i.id}">−</button>
        <span>${i.qty}</span>
        <button data-action="plus" data-id="${i.id}">＋</button>
       </div>
      </div>
      <div class="cart-right">
       <strong>${money(i.price*i.qty)}</strong>
       <button class="btn danger btn-sm" data-action="remove" data-id="${i.id}">Remover</button>
      </div>
     </div>
    `).join(""):'<div class="empty">🛒<br><br>Carrinho vazio.<br><span class="small">Adicione produtos para começar.</span></div>'}
    </div>

    <div class="summary">
     <div class="sumrow"><span>Subtotal</span><strong>${money(totalCart())}</strong></div>
     <div class="sumrow"><span>Desconto</span><strong>${money(0)}</strong></div>
     <div class="sumrow total"><span>Total</span><span>${money(totalCart())}</span></div>
     <label for="payment">Forma de pagamento</label>
     <select id="payment" ${!db.cashOpen?"disabled":""}>
      ${["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Transferência"].map(p=>
       `<option ${payment===p?"selected":""}>${p}</option>`
      ).join("")}
     </select>
     <button class="btn primary full" id="finishSale"
      ${!cart.length||!db.cashOpen?"disabled":""}>
      ✓ Finalizar venda · ${money(totalCart())}
     </button>
     <p class="hint">${db.cashOpen
       ?"Ao confirmar, o estoque será atualizado e a venda entrará no caixa."
       :"O caixa está fechado. Abra-o para vender."}</p>
    </div>
   </div>
  </section>
 </div>`;
}

function renderStockRows(products) {
 if(!products.length) return '<tr><td colspan="8">Nenhum produto encontrado.</td></tr>';
 return products.map(p=>`
  <tr>
   <td>${esc(p.sku)}</td>
   <td><strong>${esc(p.name)}</strong></td>
   <td>${esc(p.category)}</td>
   <td>${p.stock}</td>
   <td>${money(p.cost)}</td>
   <td>${money(p.price)}</td>
   <td><span class="badge ${p.stock===0?"red":p.stock<=p.min?"yellow":"green"}">
    ${p.stock===0?"Sem estoque":p.stock<=p.min?"Estoque baixo":"Disponível"}
   </span></td>
   <td><button class="btn secondary btn-sm edit-product" data-id="${p.id}">Editar</button></td>
  </tr>
 `).join("");
}

function renderStock() {
 const units=db.products.reduce((s,p)=>s+p.stock,0);
 const cost=db.products.reduce((s,p)=>s+p.cost*p.stock,0);
 const low=db.products.filter(p=>p.stock<=p.min).length;

 return `
 <div class="section-head">
  <div><h2>Estoque</h2><p>O saldo é atualizado a cada venda confirmada no PDV.</p></div>
  <button class="btn primary" id="newProduct">＋ Novo produto</button>
 </div>
 <div class="stats">
  <div class="stat"><div class="stat-label">Produtos</div><div class="stat-value">${db.products.length}</div></div>
  <div class="stat"><div class="stat-label">Unidades em estoque</div><div class="stat-value">${units}</div></div>
  <div class="stat"><div class="stat-label">Valor em custo</div><div class="stat-value">${money(cost)}</div></div>
  <div class="stat"><div class="stat-label">Estoque baixo</div><div class="stat-value">${low}</div></div>
 </div>
 <section class="panel">
  <div class="panel-head"><h3>Produtos cadastrados</h3>
   <input class="search" id="stockSearch" placeholder="Filtrar produtos...">
  </div>
  <div class="table-wrap"><table>
   <thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Qtd.</th>
   <th>Custo</th><th>Venda</th><th>Status</th><th>Ações</th></tr></thead>
   <tbody id="stockRows">${renderStockRows(db.products)}</tbody>
  </table></div>
 </section>
 <p class="hint">Os produtos iniciais são apenas exemplos. Cadastre os produtos reais antes de usar nas vendas.</p>`;
}

function renderCash() {
 const sales=salesToday();
 const total=sales.reduce((s,v)=>s+v.total,0);
 const byPayment={};
 sales.forEach(s=>byPayment[s.payment]=(byPayment[s.payment]||0)+s.total);

 return `
 <div class="section-head"><div><h2>Caixa</h2>
 <p>Entradas registradas pelo PDV.</p></div>
 <span class="badge ${db.cashOpen?"green":"red"}">${db.cashOpen?"Aberto":"Fechado"}</span></div>

 <div class="stats">
  <div class="stat"><div class="stat-label">Vendas de hoje</div><div class="stat-value">${money(total)}</div></div>
  <div class="stat"><div class="stat-label">Dinheiro</div><div class="stat-value">${money(byPayment["Dinheiro"]||0)}</div></div>
  <div class="stat"><div class="stat-label">Pix</div><div class="stat-value">${money(byPayment["Pix"]||0)}</div></div>
  <div class="stat"><div class="stat-label">Cartões</div><div class="stat-value">${money((byPayment["Cartão de débito"]||0)+(byPayment["Cartão de crédito"]||0))}</div></div>
 </div>

 <section class="panel">
  <div class="panel-head"><h3>Vendas registradas</h3>
   <button class="btn secondary btn-sm" id="exportSales">Exportar CSV</button>
  </div>
  <div class="table-wrap"><table>
   <thead><tr><th>Número</th><th>Data</th><th>Itens</th><th>Pagamento</th><th>Total</th></tr></thead>
   <tbody>
   ${db.sales.slice().reverse().map(s=>`
    <tr>
     <td>#${String(s.id).padStart(5,"0")}</td>
     <td>${new Date(s.date).toLocaleString("pt-BR")}</td>
     <td>${s.items.reduce((n,i)=>n+i.qty,0)}</td>
     <td>${esc(s.payment)}</td><td><strong>${money(s.total)}</strong></td>
    </tr>
   `).join("")||'<tr><td colspan="5" class="empty">Nenhuma venda registrada.</td></tr>'}
   </tbody>
  </table></div>
 </section>
 <p class="hint">Este módulo registra vendas. Despesas, retiradas, sangria e conferência física do dinheiro ainda precisam ser implementadas.</p>`;
}

function renderReports() {
 const total=db.sales.reduce((s,v)=>s+v.total,0);
 const cost=db.sales.reduce((s,v)=>s+v.items.reduce((a,i)=>a+i.cost*i.qty,0),0);
 const ranking={};
 db.sales.forEach(s=>s.items.forEach(i=>ranking[i.name]=(ranking[i.name]||0)+i.qty));
 const top=Object.entries(ranking).sort((a,b)=>b[1]-a[1]);

 return `
 <div class="section-head"><div><h2>Relatórios</h2>
 <p>Resumo das vendas registradas neste navegador.</p></div>
 <button class="btn secondary" id="exportSales">Exportar CSV</button></div>
 <div class="stats">
  <div class="stat"><div class="stat-label">Vendas</div><div class="stat-value">${db.sales.length}</div></div>
  <div class="stat"><div class="stat-label">Faturamento bruto</div><div class="stat-value">${money(total)}</div></div>
  <div class="stat"><div class="stat-label">Custo estimado</div><div class="stat-value">${money(cost)}</div></div>
  <div class="stat"><div class="stat-label">Margem bruta estimada</div><div class="stat-value">${money(total-cost)}</div></div>
 </div>
 <section class="panel">
  <div class="panel-head"><h3>Produtos mais vendidos</h3></div>
  <div class="table-wrap"><table><thead><tr><th>Produto</th><th>Unidades vendidas</th></tr></thead>
  <tbody>${top.map(([name,qty])=>`<tr><td>${esc(name)}</td><td>${qty}</td></tr>`).join("")||'<tr><td colspan="2">Ainda não há vendas.</td></tr>'}</tbody></table></div>
 </section>
 <p class="hint">A margem não é lucro líquido: não considera despesas, impostos nem taxas de cartão.</p>`;
}

function renderModule(which) {
 const modules={
  os:["🧾","Ordens de serviço","Cadastro de serviços, mão de obra, peças utilizadas e andamento de cada atendimento."],
  clientes:["👥","Clientes","Cadastro de clientes e histórico de compras e serviços."],
  veiculos:["🏍️","Veículos","Cadastro das motos, placas, modelos e histórico de manutenção."]
 };
 const m=modules[which]||["🔧","Módulo","Área de gestão."];
 return `<section class="panel module">
  <div class="emoji">${m[0]}</div><h2>${m[1]}</h2>
  <p>${m[2]}</p><span class="badge">Módulo ainda não implementado</span><br><br>
  <button class="btn primary" id="backPDV">Voltar ao PDV</button>
 </section>`;
}

function addToCart(id) {
 const p=db.products.find(p=>p.id===id);
 if(!p||p.stock<=0||!db.cashOpen) return;
 const item=cart.find(i=>i.id===id);
 if(item) {
   if(item.qty>=p.stock) return notify("Quantidade maior que o estoque disponível.");
   item.qty++;
 } else {
   cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});
 }
 render();
}

function cartAction(action,id) {
 const item=cart.find(i=>i.id===id);
 const product=db.products.find(p=>p.id===id);
 if(!item) return;

 if(action==="remove") cart=cart.filter(i=>i.id!==id);
 if(action==="minus") {
   item.qty--;
   if(item.qty<=0) cart=cart.filter(i=>i.id!==id);
 }
 if(action==="plus") {
   if(item.qty>=product.stock) return notify("Estoque insuficiente.");
   item.qty++;
 }
 render();
}

function finishSale() {
 if(!db.cashOpen) return notify("O caixa está fechado.");
 if(!cart.length) return;

 for(const item of cart) {
   const product=db.products.find(p=>p.id===item.id);
   if(!product||product.stock<item.qty)
     return notify("Estoque insuficiente para "+item.name+".");
 }

 if(!confirm("Confirmar venda de "+money(totalCart())+"?")) return;

 const items=cart.map(i=>({...i}));
 const sale={
   id:db.nextSaleId++,
   date:new Date().toISOString(),
   payment,
   items,
   total:items.reduce((s,i)=>s+i.price*i.qty,0)
 };

 items.forEach(i=>{
   const product=db.products.find(p=>p.id===i.id);
   product.stock-=i.qty;
   db.movements.push({
     date:sale.date,productId:product.id,
     type:"saida_venda",quantity:i.qty,saleId:sale.id
   });
 });

 db.sales.push(sale);
 save();
 cart=[];
 search="";
 render();
 notify("Venda registrada. Estoque atualizado automaticamente.");
}

function toggleCash() {
 if(db.cashOpen) {
   if(!confirm("Fechar o caixa? As vendas ficarão bloqueadas.")) return;
   db.cashOpen=false;
 } else {
   if(!confirm("Abrir o caixa para novas vendas?")) return;
   db.cashOpen=true;
 }
 save();
 render();
}

function productForm(id) {
 const old=id?db.products.find(p=>p.id===id):null;
 const ask=(label,value)=>prompt(label,value??"");
 const name=ask("Nome do produto:",old?.name||"");
 if(name===null)return;
 if(!name.trim())return notify("Informe o nome.");

 const sku=ask("Código do produto:",old?.sku||"PEC-"+String(Date.now()).slice(-6));
 if(sku===null)return;
 const category=ask("Categoria:",old?.category||"Geral");
 if(category===null)return;
 const price=ask("Preço de venda (R$):",old?.price??"0");
 if(price===null)return;
 const cost=ask("Custo unitário (R$):",old?.cost??"0");
 if(cost===null)return;
 const stock=ask("Quantidade atual:",old?.stock??"0");
 if(stock===null)return;
 const min=ask("Estoque mínimo:",old?.min??"2");
 if(min===null)return;

 const num=v=>Number(String(v).replace(",","."));
 const values=[num(price),num(cost),num(stock),num(min)];

 if(values.some(v=>!Number.isFinite(v)||v<0)||
    !Number.isInteger(values[2])||!Number.isInteger(values[3]))
   return notify("Confira os valores informados.");

 const product={
   id:old?old.id:Math.max(0,...db.products.map(p=>p.id))+1,
   name:name.trim(),sku:sku.trim(),category:category.trim(),
   price:values[0],cost:values[1],stock:values[2],min:values[3],
   icon:old?.icon||"📦"
 };

 if(old) Object.assign(old,product);
 else db.products.push(product);

 save();
 render();
 notify("Produto salvo.");
}

function exportSales() {
 if(!db.sales.length)return notify("Não há vendas para exportar.");
 const rows=[["Venda","Data","Produto","Código","Quantidade","Preço","Custo","Pagamento","Total"]];
 db.sales.forEach(s=>s.items.forEach(i=>{
   const p=db.products.find(p=>p.id===i.id);
   rows.push([
    s.id,new Date(s.date).toLocaleString("pt-BR"),i.name,
    p?.sku||"",i.qty,i.price,i.cost,s.payment,s.total
   ]);
 }));
 const csv=rows.map(row=>row.map(v=>
   '"'+String(v??"").replace(/"/g,'""')+'"'
 ).join(";")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="john-motos-vendas.csv";a.click();
 URL.revokeObjectURL(url);
}

function bindPage() {
 document.querySelectorAll(".nav-btn").forEach(b=>{
   b.onclick=()=>setPage(b.dataset.page);
 });

 const searchInput=$("productSearch");
 if(searchInput) {
   searchInput.oninput=e=>{
     search=e.target.value;
     const start=e.target.selectionStart;
     render();
     const next=$("productSearch");
     next.focus();
     next.setSelectionRange(start,start);
   };
 }

 if($("clearSearch")) $("clearSearch").onclick=()=>{search="";render();};
 document.querySelectorAll(".add-product").forEach(b=>{
   b.onclick=()=>addToCart(Number(b.dataset.id));
 });
 document.querySelectorAll("[data-action]").forEach(b=>{
   b.onclick=()=>cartAction(b.dataset.action,Number(b.dataset.id));
 });
 if($("emptyCart")) $("emptyCart").onclick=()=>{cart=[];render();};
 if($("payment")) $("payment").onchange=e=>payment=e.target.value;
 if($("finishSale")) $("finishSale").onclick=finishSale;
 if($("toggleCash")) $("toggleCash").onclick=toggleCash;
 if($("newProduct")) $("newProduct").onclick=()=>productForm();

 if($("stockSearch")) {
   $("stockSearch").oninput=e=>{
     const q=e.target.value.toLowerCase();
     $("stockRows").innerHTML=renderStockRows(db.products.filter(p=>
       (p.name+" "+p.sku+" "+p.category).toLowerCase().includes(q)
     ));
     bindEdits();
   };
 }
 bindEdits();

 if($("backPDV")) $("backPDV").onclick=()=>setPage("pdv");
 document.querySelectorAll("#exportSales").forEach(b=>b.onclick=exportSales);
}

function bindEdits() {
 document.querySelectorAll(".edit-product").forEach(b=>{
   b.onclick=()=>productForm(Number(b.dataset.id));
 });
}

$("toggleCash").onclick=toggleCash;
render();

})();
</script>
</body>
</html>
